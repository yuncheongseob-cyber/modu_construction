<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장 생산성 기록</title>
<style id="app-css">
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --bg: #F3F5F4;
    --surface: #FFFFFF;
    --surface-2: #E9EDEB;
    --surface-3: #DEE5E1;
    --border: #D3DAD7;
    --text: #1B2421;
    --text-muted: #5B6B65;
    --text-faint: #8B9893;
    --accent: #E8630A;
    --accent-ink: #FFFFFF;
    --accent-soft: #FCE3D2;
    --good: #2E7D4F;
    --good-soft: #DFF0E5;
    --warn: #A8720A;
    --warn-soft: #FBEDD1;
    --bad: #C4432B;
    --bad-soft: #FBE2DC;
    --shadow: 0 1px 2px rgba(20, 30, 27, 0.06), 0 4px 16px rgba(20, 30, 27, 0.06);
    --radius: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181A;
      --surface: #1D2326;
      --surface-2: #242B2E;
      --surface-3: #2C3437;
      --border: #37403F;
      --text: #E8ECEA;
      --text-muted: #9AA7A2;
      --text-faint: #6C7975;
      --accent: #FF8A3D;
      --accent-ink: #1A1206;
      --accent-soft: #3A2413;
      --good: #4CAF75;
      --good-soft: #1B3226;
      --warn: #E0A82E;
      --warn-soft: #362A0E;
      --bad: #E2604A;
      --bad-soft: #3A1F18;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #14181A;
    --surface: #1D2326;
    --surface-2: #242B2E;
    --surface-3: #2C3437;
    --border: #37403F;
    --text: #E8ECEA;
    --text-muted: #9AA7A2;
    --text-faint: #6C7975;
    --accent: #FF8A3D;
    --accent-ink: #1A1206;
    --accent-soft: #3A2413;
    --good: #4CAF75;
    --good-soft: #1B3226;
    --warn: #E0A82E;
    --warn-soft: #362A0E;
    --bad: #E2604A;
    --bad-soft: #3A1F18;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans KR", "Pretendard", -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1, h2, h3, .display {
    font-family: "Barlow Semi Condensed", "IBM Plex Sans KR", sans-serif;
    text-wrap: balance;
    letter-spacing: 0.01em;
  }
  .num { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  a { color: inherit; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .shell {
    max-width: 1320px;
    margin: 0 auto;
    padding: 22px 20px 64px;
  }
  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .masthead .brand { display: flex; align-items: baseline; gap: 10px; }
  .masthead .brand .mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: "Barlow Semi Condensed", sans-serif;
    font-weight: 700;
    font-size: 17px;
    flex: none;
  }
  .masthead h1 { font-size: 22px; font-weight: 700; margin: 0; }
  .masthead .sub { color: var(--text-muted); font-size: 13px; }
  .sync-note { font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); flex: none; }
  .sync-dot.off { background: var(--text-faint); box-shadow: 0 0 0 3px var(--surface-2); }

  .toggle {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    margin-bottom: 22px;
  }
  .toggle button {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .toggle button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  .view { display: none; }
  .view.active { display: block; }

  .phone-wrap { display: flex; justify-content: center; }
  .phone {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 26px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .phone-topbar { background: var(--surface-2); padding: 14px 18px 12px; border-bottom: 1px solid var(--border); }
  .phone-topbar .app-name { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 16px; }
  .phone-topbar .app-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .phone-body { padding: 16px 18px 22px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600; color: var(--text-muted);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 11px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); font-size: 14.5px; font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .range-inputs { display: flex; align-items: center; gap: 6px; }
  .range-inputs input { flex: 1; min-width: 0; }
  .range-inputs .range-sep { color: var(--text-faint); font-size: 13px; flex: none; }

  .worker-field { padding: 12px; background: var(--surface-2); border-radius: 10px; margin-bottom: 16px; }
  .worker-field label:first-child { margin-bottom: 6px; }
  .remember-check {
    display: flex; align-items: center; gap: 6px; margin-top: 9px;
    font-size: 12px; color: var(--text-muted); text-transform: none; letter-spacing: 0; font-weight: 500;
  }
  .remember-check input[type="checkbox"] { width: auto; accent-color: var(--accent); }

  .photo-add-btn {
    width: 100%; padding: 10px; border: 1.5px dashed var(--border); border-radius: 8px;
    background: var(--surface-2); color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .photo-add-btn:hover { border-color: var(--accent); color: var(--text); }
  .photo-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .photo-thumb { position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); flex: none; }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-remove {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; border: none;
    background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 10px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }

  .gallery-list { display: flex; flex-direction: column; gap: 18px; }
  .gallery-group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; flex-wrap: wrap; }
  .gallery-meta { font-size: 12px; color: var(--text-muted); }
  .gallery-thumbs { display: flex; flex-wrap: wrap; gap: 10px; }
  .gallery-thumb { width: 112px; flex: none; }
  .gallery-thumb img { width: 112px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); display: block; }
  .gallery-dl {
    margin-top: 5px; width: 100%; padding: 5px 0; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .gallery-dl:hover { color: var(--text); border-color: var(--accent); }

  .storage-panel .storage-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
  .storage-panel .storage-figures { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--text-muted); }
  .storage-panel .storage-figures b { color: var(--text); font-weight: 600; }
  .storage-track { height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
  .storage-fill { height: 100%; border-radius: 6px; transition: width 0.4s ease; }
  .storage-fill.good { background: var(--good); }
  .storage-fill.warn { background: var(--warn); }
  .storage-fill.bad { background: var(--bad); }
  .storage-note { font-size: 11.5px; color: var(--text-faint); margin-top: 7px; }

  .storage-chip {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 8px;
    font-size: 12px; font-weight: 600; margin-bottom: 14px;
  }
  .storage-chip.warn { background: var(--warn-soft); color: var(--warn); }
  .storage-chip.bad { background: var(--bad-soft); color: var(--bad); }

  .section-title {
    font-family: "Barlow Semi Condensed", sans-serif; font-weight: 600; font-size: 15px;
    margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--surface-3);
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-title .unit-note { font-size: 11px; color: var(--text-faint); font-weight: 500; }

  .dash-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; margin-bottom: 14px;
  }
  .dash-toolbar .toolbar-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .dash-toolbar select {
    padding: 8px 32px 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); font-size: 13.5px; font-family: "IBM Plex Mono", monospace;
  }
  .dash-toolbar select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .dash-toolbar .toolbar-group { display: flex; align-items: center; gap: 8px; }

  .date-filter-wrap { position: relative; }
  .date-filter-btn {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); font-size: 13.5px; font-family: "IBM Plex Mono", monospace;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .date-filter-btn:hover { border-color: var(--accent); }
  .date-filter-btn .caret { font-size: 10px; color: var(--text-faint); }
  .date-filter-panel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; width: 230px; max-height: 340px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 6px;
  }
  .date-filter-search {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; margin-bottom: 6px;
    background: var(--surface-2); color: var(--text); font-size: 12.5px; font-family: inherit;
  }
  .date-filter-search:focus { outline: none; border-color: var(--accent); }
  .date-filter-all, .date-filter-year, .date-filter-month, .date-filter-date {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: 12.5px; cursor: pointer; border-radius: 6px;
  }
  .date-filter-all { font-weight: 700; border-bottom: 1px solid var(--surface-2); border-radius: 0; margin-bottom: 2px; }
  .date-filter-year { font-weight: 700; }
  .date-filter-month { font-weight: 600; color: var(--text-muted); }
  .date-filter-date { font-family: "IBM Plex Mono", monospace; }
  .date-filter-date:hover, .date-filter-month:hover, .date-filter-year:hover, .date-filter-all:hover { background: var(--surface-2); }
  .date-filter-all input, .date-filter-year input, .date-filter-month input, .date-filter-date input { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; flex: none; }
  .date-filter-node { margin-top: 1px; }
  .date-filter-row { display: flex; align-items: center; }
  .date-filter-row .date-filter-year, .date-filter-row .date-filter-month { flex: 1; padding-left: 2px; }
  .date-filter-toggle {
    border: none; background: none; color: var(--text-faint); cursor: pointer; font-size: 15px;
    width: 28px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center;
  }
  .date-filter-toggle:hover { color: var(--text); background: var(--surface-2); border-radius: 6px; }
  .date-filter-children { padding-left: 20px; }

  .qty-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .qty-item label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
  .qty-item .input-unit { position: relative; }
  .qty-item input {
    width: 100%; padding: 9px 34px 9px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); font-size: 14px; font-family: "IBM Plex Mono", monospace;
  }
  .qty-item .unit { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--text-faint); pointer-events: none; }

  .submit-btn {
    width: 100%; margin-top: 20px; padding: 13px; border: none; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 700;
    font-family: "Barlow Semi Condensed", sans-serif; letter-spacing: 0.02em; cursor: pointer;
  }
  .submit-btn:active { transform: scale(0.985); }
  .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px);
    background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px;
    font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .kpi-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .kpi-tile .label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .kpi-tile .value { font-family: "IBM Plex Mono", monospace; font-size: 25px; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kpi-tile .value .unit { font-size: 13px; color: var(--text-muted); font-weight: 500; margin-left: 3px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
  .panel h2 { font-size: 16.5px; font-weight: 600; margin: 0 0 14px; }
  .panel h2 .count { color: var(--text-muted); font-weight: 500; font-size: 13px; }
  .panel .panel-caption { font-size: 11.5px; color: var(--text-faint); margin: -8px 0 14px; }

  .dash-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; align-items: start; }

  .bar-row { display: grid; grid-template-columns: 90px 1fr 64px; align-items: center; gap: 10px; margin-bottom: 12px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-row .team-tag { font-size: 13px; font-weight: 600; }
  .bar-track { height: 14px; background: var(--surface-2); border-radius: 7px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 7px; background: var(--accent); transition: width 0.4s ease; }
  .bar-row .bar-val { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; text-align: right; color: var(--text-muted); }

  .team-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .team-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .team-card .tt { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .team-card .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .team-card .stat-line { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; color: var(--text-muted); }
  .team-card .stat-line .v { font-family: "IBM Plex Mono", monospace; color: var(--text); font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-faint); font-weight: 600; padding: 0 10px 8px; border-bottom: 1px solid var(--border);
  }
  tbody td { padding: 9px 10px; border-bottom: 1px solid var(--surface-2); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  .num-cell { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; text-align: right; }
  .table-scroll { overflow-x: auto; }
  .team-pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .shift-pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--text-muted); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13.5px; }

  .dash-shell { display: flex; align-items: flex-start; gap: 20px; }
  .dash-sidebar {
    width: 186px; flex: none; display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px;
  }
  .dash-sidebar button {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: none; background: transparent;
    border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--text-muted); cursor: pointer;
    text-align: left; width: 100%;
  }
  .dash-sidebar button:hover { background: var(--surface-2); color: var(--text); }
  .dash-sidebar button.active { background: var(--accent-soft); color: var(--accent); }
  .dash-sidebar .nav-icon { width: 18px; text-align: center; flex: none; font-size: 14px; }
  .dash-content { flex: 1; min-width: 0; }

  .stat-table-wrap { overflow-x: auto; }
  .stat-table { border-collapse: collapse; font-size: 12.5px; min-width: 100%; }
  .stat-table th, .stat-table td { padding: 7px 11px; border-bottom: 1px solid var(--surface-2); white-space: nowrap; }
  .stat-table thead th {
    background: var(--surface); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--text-faint); font-weight: 600; border-bottom: 1px solid var(--border); text-align: right;
  }
  .stat-table thead th.rowlabel { text-align: left; }
  .stat-table td.rowlabel {
    position: sticky; left: 0; background: var(--surface); text-align: left; font-weight: 600;
    color: var(--text); z-index: 1; font-family: "IBM Plex Sans KR", sans-serif;
  }
  .stat-table td.rowlabel .unit-tag { color: var(--text-faint); font-weight: 400; font-size: 11px; margin-left: 3px; }
  .stat-table td.num { text-align: right; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  .stat-table tbody tr:last-child td { border-bottom: none; }

  .team-panel-head { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; flex-wrap: wrap; }
  .team-panel-head .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .team-panel-head .count { font-size: 12.5px; color: var(--text-muted); font-weight: 500; margin-left: 2px; }

  .input-subtabs {
    display: flex; justify-content: center; gap: 6px; margin-bottom: 16px;
  }
  .input-subtabs button {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
    font-size: 12.5px; font-weight: 600; padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  .input-subtabs button.active { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  .account-bar {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin-bottom: 12px;
    background: var(--surface-2); border-radius: 10px; font-size: 12.5px; flex-wrap: wrap;
  }
  .account-bar-id { font-weight: 700; }
  .account-bar-meta { color: var(--text-muted); }
  .account-bar-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
    font-size: 11.5px; font-weight: 600; padding: 5px 10px; border-radius: 7px; cursor: pointer;
  }
  .account-bar-btn:hover { color: var(--text); border-color: var(--accent); }

  .auth-tabs { display: flex; gap: 6px; margin-bottom: 16px; }

  // ---- personal manday calendar ----
  function mandayShiftValue(shifts) {
    return (shifts || []).reduce(function (s, k) { return s + (SHIFT_WEIGHT[k] || 0); }, 0);
  }

  var mandayDraft = null;         // { "YYYY-MM-DD": {shifts:["day","ot"], note:"..."}, ... } — reference to the active month's working copy
  var mandayDraftWorkerId = null; // resets the whole store when the worker id changes
  var mandayDraftStore = {};      // month -> draft object, kept across month navigation so unsaved edits survive
  var mandaySelectedDate = null;

  function ensureMandayDraft(st, workerId, month) {
    if (mandayDraftWorkerId !== workerId) {
      mandayDraftStore = {};
      mandayDraftWorkerId = workerId;
    }
    if (!mandayDraftStore[month]) {
      var d = {};
      (st.mandayLog || []).forEach(function (r) {
        if (r.workerId === workerId && r.date.slice(0, 7) === month) d[r.date] = { shifts: (r.shifts || []).slice(), note: r.note || "" };
      });
      mandayDraftStore[month] = d;
    }
    mandayDraft = mandayDraftStore[month];
  }

  function addMonths(month, delta) {
    var y = parseInt(month.slice(0, 4), 10), mo = parseInt(month.slice(5, 7), 10);
    var d = new Date(y, mo - 1 + delta, 1);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }

  function buildMandayCalendarHtml(st) {
    var account = currentAccount();
    var workerId = account ? account.workerId : "";
    var team = (account && account.team) || st.teams[0] || "";
    var teamOpts = st.teams.map(function (t) {
      return '<option value="' + escapeHtml(t) + '"' + (t === team ? " selected" : "") + '>' + escapeHtml(t) + "</option>";
    }).join("");
    var month = currentMandayMonth || todayStr().slice(0, 7);
    ensureMandayDraft(st, workerId, month);
    var today = todayStr();
    if (!mandaySelectedDate || mandaySelectedDate.slice(0, 7) !== month) {
      mandaySelectedDate = month === today.slice(0, 7) ? today : (month + "-01");
    }

    var y = parseInt(month.slice(0, 4), 10), mo = parseInt(month.slice(5, 7), 10);
    var days = daysInMonth(y, mo);
    var firstDow = new Date(y, mo - 1, 1).getDay();
    var prevMonthDays = daysInMonth(mo === 1 ? y - 1 : y, mo === 1 ? 12 : mo - 1);

    var total = 0;
    var workDayCount = 0;
    Object.keys(mandayDraft).forEach(function (k) {
      var v = mandayShiftValue(mandayDraft[k].shifts);
      if (v > 0) { total += v; workDayCount += 1; }
    });

    var weekdayHeader = WEEKDAY_LABELS.map(function (w, i) {
      return '<div class="cal-wd-label' + (i === 0 ? " wd-sun" : i === 6 ? " wd-sat" : "") + '">' + w + "</div>";
    }).join("");

    var leadCells = "";
    for (var lc = 0; lc < firstDow; lc++) {
      var pd = prevMonthDays - firstDow + lc + 1;
      leadCells += '<div class="cal-cell cal-outside"><span class="cal-daynum">' + pd + "</span></div>";
    }

    var dayCells = "";
    for (var d = 1; d <= days; d++) {
      var dateStr = month + "-" + String(d).padStart(2, "0");
      var dayEntry = mandayDraft[dateStr] || { shifts: [], note: "" };
      var val = mandayShiftValue(dayEntry.shifts);
      var hasNote = !!(dayEntry.note && dayEntry.note.trim());
      var isToday = dateStr === today;
      var isSelected = dateStr === mandaySelectedDate;
      var cls = "cal-cell" + (isToday ? " cal-today" : "") + (isSelected ? " cal-selected" : "") + (val ? " cal-has-value" : "");
      dayCells += '<button type="button" class="' + cls + '" data-date="' + dateStr + '">' +
        '<span class="cal-daynum">' + d + "</span>" +
        (val ? '<span class="cal-badge">' + fmt1(val) + "</span>" : "") +
        (hasNote ? '<span class="cal-note-dot" title="메모 있음"></span>' : "") +
      "</button>";
    }

    var totalCells = firstDow + days;
    var trailCells = "";
    var trailCount = (7 - (totalCells % 7)) % 7;
    for (var tc = 1; tc <= trailCount; tc++) {
      trailCells += '<div class="cal-cell cal-outside"><span class="cal-daynum">' + tc + "</span></div>";
    }

    var selEntry = mandayDraft[mandaySelectedDate] || { shifts: [], note: "" };
    var selShifts = selEntry.shifts;
    var selVal = mandayShiftValue(selShifts);
    var selD = new Date(mandaySelectedDate + "T00:00:00");
    var selLabel = (selD.getMonth() + 1) + "월 " + selD.getDate() + "일 (" + WEEKDAY_LABELS[selD.getDay()] + ")";
    var editorChips = SHIFT_ORDER.map(function (k) {
      var active = selShifts.indexOf(k) >= 0;
      return '<button type="button" class="shift-chip' + (active ? " active" : "") + '" data-shift="' + k + '">' + SHIFT_LABELS[k] + "</button>";
    }).join("");

    return "" +
      '<div class="phone-wrap"><div class="phone">' +
        '<div class="phone-topbar">' +
          '<div class="app-name">🧾 내 공수 캘린더</div>' +
          '<div class="app-sub">날짜를 선택하고 근무형태를 눌러 공수를 등록하세요</div>' +
        "</div>" +
        '<div class="phone-body">' +
          '<div class="field"><label>소속팀</label><select id="mTeam">' + teamOpts + "</select></div>" +

          '<div class="cal-monthnav">' +
            '<button type="button" class="cal-nav-btn" data-monthnav="-1">‹</button>' +
            '<div class="cal-month-label">' + y + "년 " + mo + "월</div>" +
            '<button type="button" class="cal-nav-btn" data-monthnav="1">›</button>' +
          "</div>" +
          '<div class="cal-grid">' + weekdayHeader + leadCells + dayCells + trailCells + "</div>" +

          '<div class="manday-editor">' +
            '<div class="me-date">' + escapeHtml(selLabel) + "</div>" +
            '<div class="me-shifts">' + editorChips + "</div>" +
            '<div class="me-value">' + (selVal ? fmt1(selVal) + "공수 등록됨" : "선택된 근무가 없어요") + "</div>" +
            '<div class="field" style="margin:10px 0 0"><label>메모</label><textarea id="mNote" rows="2" placeholder="예: 반차, 교육, 특이사항 메모">' + escapeHtml(selEntry.note || "") + "</textarea></div>" +
          "</div>" +

          '<div class="manday-total">이 달 합계 <b id="mandayTotal">' + fmt1(total) + "공수</b> · 근무일수 " + workDayCount + "일</div>" +
          '<button type="button" class="submit-btn" id="btnSaveManday">공수 저장</button>' +
        "</div>" +
      "</div></div>";
  }

  // ---- attendance (clock in/out) ----
  function fmtHM(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  function fmtDurationMs(ms) {
    if (!ms || ms < 0) ms = 0;
    var totalMin = Math.round(ms / 60000);
    var h = Math.floor(totalMin / 60), m = totalMin % 60;
    return h + "시간 " + m + "분";
  }
  function attendanceSortDesc(a, b) {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (b.clockInAt || 0) - (a.clockInAt || 0);
  }
  function buildAttGeoStatusHtml(geo) {
    if (!geo.enabled) return '<div class="att-geo-status att-geo-off">📍 위치 확인 없이 사용 중이에요 (관리자 설정)</div>';
    var s = attLocationState;
    if (s.status === "idle" || s.status === "checking") {
      return '<div class="att-geo-status att-geo-checking">📍 현재 위치 확인 중…</div>';
    }
    if (s.status === "unsupported") {
      return '<div class="att-geo-status att-geo-bad">이 기기·브라우저는 위치 확인을 지원하지 않아요. 관리자에게 문의해주세요.</div>';
    }
    if (s.status === "error") {
      return '<div class="att-geo-status att-geo-bad">위치 정보를 가져오지 못했어요 (' + escapeHtml(s.message || "권한을 확인해주세요") + ')' +
        '<button type="button" class="att-geo-retry" id="btnAttGeoRetry">다시 확인</button></div>';
    }
    if (s.within) {
      return '<div class="att-geo-status att-geo-ok">✅ 지정 현장 반경 안에 있어요 (약 ' + Math.round(s.distance) + "m)</div>";
    }
    return '<div class="att-geo-status att-geo-bad">🚫 지정 현장에서 약 ' + Math.round(s.distance) + "m 떨어져 있어요 · 반경 " + geo.radius + "m 안에서만 출퇴근할 수 있어요" +
      '<button type="button" class="att-geo-retry" id="btnAttGeoRetry">다시 확인</button></div>';
  }

  function buildAttendanceViewHtml(st) {
    var account = currentAccount();
    var workerId = account ? account.workerId : "";
    var team = (account && account.team) || st.teams[0] || "";
    var teamOpts = st.teams.map(function (t) {
      return '<option value="' + escapeHtml(t) + '"' + (t === team ? " selected" : "") + '>' + escapeHtml(t) + "</option>";
    }).join("");
    var log = (st.attendance || []).filter(function (r) { return r.workerId === workerId; });
    var today = todayStr();
    var openRecord = log.filter(function (r) { return !r.clockOutAt; }).sort(attendanceSortDesc)[0];
    var todayRecords = log.filter(function (r) { return r.date === today; }).sort(attendanceSortDesc);

    var geo = getAttGeo(st);
    var geoStatusHtml = buildAttGeoStatusHtml(geo);
    var geoFailed = geo.enabled && (attLocationState.status === "error" || attLocationState.status === "unsupported");
    var photoFallbackHtml = "";
    if (geoFailed) {
      photoFallbackHtml = pendingAttPhoto ?
        '<div class="att-photo-ready"><img src="' + pendingAttPhoto.dataUrl + '" alt="">얼굴 사진으로 인증 준비됐어요' +
          '<button type="button" class="retake" id="btnAttPhotoRetake">다시 찍기</button></div>' :
        '<button type="button" class="att-photo-fallback-btn" id="btnAttPhotoFallback">📷 GPS 대신 얼굴 사진으로 인증하기</button>';
    }
    var canClock = !geo.enabled || (attLocationState.status === "ok" && attLocationState.within) || (geoFailed && !!pendingAttPhoto);
    var disabledAttr = canClock ? "" : " disabled";

    var statusHtml;
    if (!workerId) {
      statusHtml = '<div class="att-status-card"><div class="att-status-label">작업자 아이디를 입력해주세요</div></div>' +
        geoStatusHtml +
        '<button type="button" class="att-clock-btn att-in" id="btnClockIn" disabled>출근하기</button>';
    } else if (openRecord) {
      var elapsed = Date.now() - openRecord.clockInAt;
      statusHtml = '<div class="att-status-card working">' +
          '<div class="att-status-label">⏰ 근무중</div>' +
          '<div class="att-status-times">' + fmtHM(openRecord.clockInAt) + ' 출근</div>' +
          '<div class="att-status-sub">경과 ' + fmtDurationMs(elapsed) + "</div>" +
        "</div>" +
        geoStatusHtml + photoFallbackHtml +
        '<button type="button" class="att-clock-btn att-out" id="btnClockOut" data-record-id="' + openRecord.id + '"' + disabledAttr + '>퇴근하기</button>';
    } else if (todayRecords.length) {
      var last = todayRecords[0];
      statusHtml = '<div class="att-status-card">' +
          '<div class="att-status-label">✅ 오늘 근무 종료</div>' +
          '<div class="att-status-times">' + fmtHM(last.clockInAt) + " – " + fmtHM(last.clockOutAt) + "</div>" +
          '<div class="att-status-sub">총 ' + fmtDurationMs(last.clockOutAt - last.clockInAt) + "</div>" +
        "</div>" +
        geoStatusHtml + photoFallbackHtml +
        '<button type="button" class="att-clock-btn att-in" id="btnClockIn"' + disabledAttr + '>다시 출근하기</button>' +
        '<button type="button" class="att-reset-btn" id="btnResetAtt" data-record-id="' + last.id + '">방금 기록 취소</button>';
    } else {
      statusHtml = '<div class="att-status-card">' +
          '<div class="att-status-label">출근 전이에요</div>' +
          '<div class="att-status-sub">버튼을 눌러 출근을 기록하세요</div>' +
        "</div>" +
        geoStatusHtml + photoFallbackHtml +
        '<button type="button" class="att-clock-btn att-in" id="btnClockIn"' + disabledAttr + '>출근하기</button>';
    }
    return finishAttendancePhone(workerId, team, teamOpts, statusHtml, log, geo);
  }

  function finishAttendancePhone(workerId, team, teamOpts, statusHtml, log, geo) {
    var mapHtml = geo.enabled ?
      '<div class="att-map small" id="attGeoWorkerMap"><div class="att-map-fallback">지도를 불러오는 중…</div></div>' +
      '<div class="att-map-legend"><span><span class="dot" style="background:#E8630A"></span>지정 현장 반경</span><span><span class="dot" style="background:#2E7D32"></span>내 위치 (반경 안)</span><span><span class="dot" style="background:#C0392B"></span>내 위치 (반경 밖)</span></div>' :
      "";
    var historyItems = log.sort(attendanceSortDesc).slice(0, 14).map(function (r) {
      var pill = r.clockOutAt ? '<span class="att-status-pill done">완료</span>' : '<span class="att-status-pill open">근무중</span>';
      var d = new Date(r.date + "T00:00:00");
      var label = (d.getMonth() + 1) + "/" + d.getDate() + " (" + WEEKDAY_LABELS[d.getDay()] + ")";
      return '<div class="att-history-row">' +
          '<span class="att-history-date">' + label + "</span>" +
          '<span class="att-history-times">' + fmtHM(r.clockInAt) + " – " + (r.clockOutAt ? fmtHM(r.clockOutAt) : "…") + "</span>" +
          '<span class="att-history-dur">' + (r.clockOutAt ? fmtDurationMs(r.clockOutAt - r.clockInAt) : "") + "</span>" +
          pill +
        "</div>";
    }).join("");

    return "" +
      '<div class="phone-wrap"><div class="phone">' +
        '<div class="phone-topbar">' +
          '<div class="app-name">⏰ 출퇴근 기록</div>' +
          '<div class="app-sub">출근·퇴근 버튼을 눌러 근무 시간을 기록하세요</div>' +
        "</div>" +
        '<div class="phone-body">' +
          '<div class="field"><label>소속팀</label><select id="aTeam">' + teamOpts + "</select></div>" +
          mapHtml +
          statusHtml +
          (historyItems ? '<div class="att-history"><div class="att-history-title">최근 출퇴근 기록</div>' + historyItems + "</div>" :
            '<div class="att-history-title" style="margin-top:16px">아직 출퇴근 기록이 없어요</div>') +
        "</div>" +
      "</div></div>";
  }

  // ================= DASHBOARD: SIDEBAR ROUTER =================
  var currentDashPage = "overview";
  var currentDashDateFilter = "all";
  var logDateFilterOpen = false;
  var dateFilterCollapsedYears = {};
  var dateFilterCollapsedMonths = {};

      '<h2>🔒 관리자 대시보드</h2>' +

      '<div class="admin-lock-note" id="adminPinError"></div>' +
    "</div>";
  }

  function buildDashViewHtml(st, page, dateFilter) {
    page = page || "overview";
    if (!isAdminUnlocked) return buildAdminLockHtml();
    var content;
    if (page === "monthly") content = buildMonthlyPageHtml(st);
    else if (page === "daily") content = buildDailyPageHtml(st);
    else if (page === "team") content = buildTeamProdPageHtml(st);
    else if (page === "manday") content = buildMandayAdminPageHtml(st);
    else if (page === "attendance") content = buildAttendancePageHtml(st);
    else if (page === "log") content = buildLogPageHtml(st, dateFilter || "all");
    else if (page === "photos") content = buildPhotoGalleryHtml(st.entries, st.teams);
    else if (page === "storage") content = buildStoragePanelHtml(st);
    else content = buildOverviewPageHtml(st);

      '<div class="dash-content">' + content + "</div></div>";

  // ---- overview page ----
  function buildOverviewPageHtml(st) {
    var teams = st.teams;

  // ---- log page ----
  function dateFilterMatches(dateFilter, date) {
    if (dateFilter === "all") return true;
    return Array.isArray(dateFilter) && dateFilter.indexOf(date) >= 0;
  }
  function dateFilterSummary(allDates, dateFilter) {
    if (dateFilter === "all") return "전체 날짜";
    var n = Array.isArray(dateFilter) ? dateFilter.length : 0;
    if (n === 0) return "날짜 선택 안함";
    if (n === allDates.length) return "전체 날짜";
    if (n === 1) return dateFilter[0];
    return n + "개 날짜 선택됨";
  }
  function buildDateFilterHtml(allDates, dateFilter) {
    var selectedSet = {};
    if (dateFilter === "all") { allDates.forEach(function (d) { selectedSet[d] = true; }); }
    else { (dateFilter || []).forEach(function (d) { selectedSet[d] = true; }); }
    var allChecked = allDates.length > 0 && allDates.every(function (d) { return selectedSet[d]; });
    var summary = dateFilterSummary(allDates, dateFilter);

    // build year -> month -> [dates] tree, ascending
    var tree = {}, years = [];
    allDates.slice().sort().forEach(function (d) {
      var y = d.slice(0, 4), m = d.slice(0, 7);
      if (!tree[y]) { tree[y] = {}; years.push(y); }
      if (!tree[y][m]) tree[y][m] = [];
      tree[y][m].push(d);
    });
    years.sort();

    var searchQ = (dateFilterSearchText || "").trim();
    function matchesSearch(d) { return !searchQ || d.indexOf(searchQ) >= 0; }

    var panelHtml = "";
    if (logDateFilterOpen) {
      var yearBlocks = years.map(function (y) {
        var months = Object.keys(tree[y]).sort();
        var visibleMonths = months.filter(function (m) { return tree[y][m].some(matchesSearch); });
        if (searchQ && !visibleMonths.length) return "";

        var yearAllDates = months.reduce(function (acc, m) { return acc.concat(tree[y][m]); }, []);
        var yearChecked = yearAllDates.every(function (d) { return selectedSet[d]; });
        var yearCollapsed = !!dateFilterCollapsedYears[y];

        var monthBlocks = visibleMonths.map(function (m) {
          var monthAllDates = tree[y][m];
          var visibleDates = monthAllDates.filter(matchesSearch);
          if (searchQ && !visibleDates.length) return "";
          var monthChecked = monthAllDates.every(function (d) { return selectedSet[d]; });
          var monthCollapsed = !!dateFilterCollapsedMonths[m];
          var monthLabel = parseInt(m.slice(5, 7), 10) + "월";

          var dayItems = monthCollapsed ? "" : visibleDates.map(function (d) {
            var checked = !!selectedSet[d];
            var dayLabel = parseInt(d.slice(8, 10), 10) + "일";
            return '<label class="date-filter-date"><input type="checkbox" data-date-item="' + d + '"' + (checked ? " checked" : "") + ">" + dayLabel + "</label>";
          }).join("");

          return '<div class="date-filter-node">' +
            '<div class="date-filter-row">' +
              '<button type="button" class="date-filter-toggle" data-toggle-month="' + m + '">' + (monthCollapsed ? "▸" : "▾") + "</button>" +
              '<label class="date-filter-month"><input type="checkbox" data-date-month="' + m + '"' + (monthChecked ? " checked" : "") + ">" + monthLabel + "</label>" +
            "</div>" +
            (monthCollapsed ? "" : '<div class="date-filter-children">' + dayItems + "</div>") +
          "</div>";
        }).join("");

        return '<div class="date-filter-node">' +
          '<div class="date-filter-row">' +
            '<button type="button" class="date-filter-toggle" data-toggle-year="' + y + '">' + (yearCollapsed ? "▸" : "▾") + "</button>" +
            '<label class="date-filter-year"><input type="checkbox" data-date-year="' + y + '"' + (yearChecked ? " checked" : "") + ">" + y + "년</label>" +
          "</div>" +
          (yearCollapsed ? "" : '<div class="date-filter-children">' + monthBlocks + "</div>") +
        "</div>";
      }).join("");

      panelHtml = '<div class="date-filter-panel" id="dateFilterPanel">' +
        '<input type="text" class="date-filter-search" id="dateFilterSearchInput" placeholder="날짜 검색 (예: 2026-08)" value="' + escapeHtml(dateFilterSearchText || "") + '">' +
        '<label class="date-filter-all"><input type="checkbox" id="dateFilterAll"' + (allChecked ? " checked" : "") + ">(모두 선택)</label>" +
        yearBlocks +
      "</div>";
    }

    return '<div class="date-filter-wrap"><button type="button" class="date-filter-btn" id="dateFilterBtn">' + escapeHtml(summary) + ' <span class="caret">▾</span></button>' + panelHtml + "</div>";
  }

  function buildLogPageHtml(st, dateFilter) {

    var allSites = [];

    allSites.sort();
    if (siteFilter !== "all" && allSites.indexOf(siteFilter) < 0) siteFilter = currentLogSiteFilter = "all";

      var roles = e.roles || {};
      var roleTxt = ROLE_KEYS.map(function (k) { return (roles[k] || 0) ? ROLE_LABELS[k] + " " + roles[k] : ""; }).filter(Boolean).join(" · ") || "—";
      return "<tr>" +
        "<td>" + escapeHtml(e.date) + " " + shiftPillHtml(e) + "</td>" +
        '<td><span class="team-pill" style="background:' + hexToSoft(color) + ";color:" + color + '">' + escapeHtml(e.team) + "</span></td>" +
        "<td>" + escapeHtml(workerLabel(e)) + "</td>" +
        "<td>" + escapeHtml(formatLocation(e)) + "</td>" +
        '<td class="num-cell">' + fmt(e.personnel) + '<div class="role-breakdown">' + escapeHtml(roleTxt) + "</div></td>" +
        '<td class="num-cell">' + fmt(e.manHours) + "</td>" +
        '<td class="num-cell">' + fmt((e.cable && e.cable.layout) || 0) + "</td>" +
        "<td>" + defectTxt + "</td>" +
        "<td>" + escapeHtml(e.note || "") + ycardTxt + formatNextDayPlanHtml(e) + "</td>" +
        '<td><button type="button" class="row-edit-btn" data-edit-entry="' + e.id + '">✎ 수정</button></td>' +
      "</tr>";
    }).join("") : '<tr><td colspan="10"><div class="empty-state">' +
      (st.entries.length === 0 ? '아직 입력된 실적이 없습니다. "현장 입력" 탭에서 첫 실적을 기록해보세요.' : "선택한 조건(" + dateFilterSummary(allDates, dateFilter) + ")에 해당하는 실적이 없습니다.") +
      "</div></td></tr>";

    return toolbarHtml + kpiHtml +
      '<div class="panel">' +
        '<div class="panel-head-row"><h2>실적 로그 <span class="count">· ' + Math.min(entries.length, 50) + '건 표시 (최대 50건)</span></h2>' +
          '<button type="button" class="csv-dl-btn" data-csv-log="1">⬇ CSV 전체 다운로드</button>' +
        "</div>" +
        '<div class="panel-caption" style="margin-top:-4px">화면엔 최대 50건만 보이지만, 다운로드는 현재 조회 조건에 해당하는 전체 실적이 담겨요.</div>' +
        '<div class="table-scroll"><table>' +
          "<thead><tr><th>일자/근무</th><th>팀</th><th>작업자</th><th>위치</th><th style=\"text-align:right\">인원</th><th style=\"text-align:right\">공수</th><th style=\"text-align:right\">포설(M)</th><th>불량</th><th>비고</th><th></th></tr></thead>" +

  // ---- monthly stats page ----

  // ---- daily stats page ----
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
  function dailyTeamAggregate(entries, month) {
    // team -> day-of-month(int) -> freshAgg()-shaped bucket
    var out = {};
    entries.forEach(function (e) {
      if (monthOf(e) !== month) return;
      var dd = dayOfMonthNum(e);
      if (!dd) return;
      if (!out[e.team]) out[e.team] = {};
      if (!out[e.team][dd]) out[e.team][dd] = freshAgg();
      accumulate(out[e.team][dd], e);
    });
    return out;
  }
  function buildDailyPageHtml(st) {
    var months = uniqueMonthsAsc(st.entries);
    if (!months.length) return emptyPanel("일별 통계", "아직 데이터가 없습니다. 실적을 입력하면 일별 투입인원이 여기 표시돼요.");
    if (!currentDailyMonth || months.indexOf(currentDailyMonth) < 0) currentDailyMonth = months[months.length - 1];

    var monthOpts = months.map(function (m) {
      return '<option value="' + m + '"' + (m === currentDailyMonth ? " selected" : "") + ">" + m + "</option>";
    }).join("");
    var toolbarHtml = '<div class="dash-toolbar">' +
      '<div class="toolbar-group"><span class="toolbar-label">조회 월</span><select id="fDailyMonth">' + monthOpts + "</select></div>" +
    "</div>";

    var y = parseInt(currentDailyMonth.slice(0, 4), 10);
    var mo = parseInt(currentDailyMonth.slice(5, 7), 10);
    var days = daysInMonth(y, mo);
    var byDay = {};
    for (var d = 1; d <= days; d++) byDay[d] = { dawn: 0, day: 0, ot: 0, night: 0, allnight: 0 };
    st.entries.forEach(function (e) {
      if (monthOf(e) !== currentDailyMonth) return;
      var dn = dayOfMonthNum(e);
      if (!dn || !byDay[dn]) return;
      var sh = SHIFT_WEIGHT[e.shift] !== undefined ? e.shift : "day";
      byDay[dn][sh] += e.personnel || 0;
    });

    var dayCols = [];
    for (var i = 1; i <= days; i++) dayCols.push(i);

    var weekdayHeadRow = "<tr><th class=\"rowlabel\">요일</th>" + dayCols.map(function (dd) {
      return "<th>" + WEEKDAY_LABELS[new Date(y, mo - 1, dd).getDay()] + "</th>";
    }).join("") + "<th>합계</th></tr>";

    // ---- panel 1: 그 날의 전체 투입인원 ----

  function buildTeamDateFilterHtml(allDates, dateFilter) {
    var selectedSet = {};

    var allChecked = allDates.length > 0 && allDates.every(function (d) { return selectedSet[d]; });
    var summary = dateFilterSummary(allDates, dateFilter);

    var tree = {}, years = [];
    allDates.slice().sort().forEach(function (d) {
      var y = d.slice(0, 4), m = d.slice(0, 7);
      if (!tree[y]) { tree[y] = {}; years.push(y); }
      if (!tree[y][m]) tree[y][m] = [];
      tree[y][m].push(d);
    });
    years.sort();

    var searchQ = (teamDateFilterSearchText || "").trim();
    function matchesSearch(d) { return !searchQ || d.indexOf(searchQ) >= 0; }

    if (teamDateFilterOpen) {

        var months = Object.keys(tree[y]).sort();

        if (searchQ && !visibleMonths.length) return "";

        var yearAllDates = months.reduce(function (acc, m) { return acc.concat(tree[y][m]); }, []);
        var yearChecked = yearAllDates.every(function (d) { return selectedSet[d]; });
        var yearCollapsed = !!teamDateFilterCollapsedYears[y];

        var monthBlocks = visibleMonths.map(function (m) {
          var monthAllDates = tree[y][m];

          var monthCollapsed = !!teamDateFilterCollapsedMonths[m];

      }).join("");

      panelHtml = '<div class="date-filter-panel" id="teamDateFilterPanel">' +
        '<input type="text" class="date-filter-search" id="teamDateFilterSearchInput" placeholder="날짜 검색 (예: 2026-08)" value="' + escapeHtml(teamDateFilterSearchText || "") + '">' +

  // ---- admin manday comparison page ----
  var currentMandayAdminMonth = null;

    var out = {};
    (st.entries || []).forEach(function (e) {
      if (monthOf(e) !== month) return;
      var dd = dayOfMonthNum(e);
      if (!dd) return;
      if (!out[e.team]) out[e.team] = {};
      out[e.team][dd] = (out[e.team][dd] || 0) + workHours(e);
    });
    return out;
  }

      return '<div class="panel">' +
        '<div class="team-panel-head"><span class="dot" style="background:' + color + '"></span><h2 style="margin:0">' + escapeHtml(team) +
          '</h2><span class="count">· 공수캘린더 합계 ' + fmt1(teamTotal) + "공수</span>" + '<span style="flex:1"></span>' +

        "</table></div>" +

  var LOGGED_IN_KEY = "sitelog_logged_in_worker_id";
  function getLoggedInWorkerId() { try { return localStorage.getItem(LOGGED_IN_KEY) || ""; } catch (e) { return ""; } }
  function setLoggedInWorkerId(id) { try { localStorage.setItem(LOGGED_IN_KEY, id); } catch (e) {} }
  function clearLoggedInWorkerId() { try { localStorage.removeItem(LOGGED_IN_KEY); } catch (e) {} }
  function getAccount(st, workerId) {
    if (!workerId || !st || !st.accounts) return null;
    return st.accounts[workerId] || null;
  }
  function isLoggedIn(st) { return !!getAccount(st, getLoggedInWorkerId()); }
  function currentAccount() { return getAccount(state, getLoggedInWorkerId()); }
  // Simple client-side hash (SHA-256 of id+password) so passwords aren't stored as plain text in Firebase.
  // Note: this is a basic deterrent, not strong security — the Firebase database itself should be locked down
  // (not left in open "test mode") once the team is set up, since anyone with the DB URL can otherwise read this.
  function hashPassword(workerId, password) {
    var input = (workerId || "").toLowerCase() + "::sitelog::" + (password || "");
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      var bytes = new TextEncoder().encode(input);
      return crypto.subtle.digest("SHA-256", bytes).then(function (buf) {
        var arr = Array.prototype.slice.call(new Uint8Array(buf));
        return arr.map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
      });
    }
    // very old browsers without SubtleCrypto: fall back to a weak numeric hash rather than plain text
    var h = 0;
    for (var i = 0; i < input.length; i++) { h = ((h << 5) - h + input.charCodeAt(i)) | 0; }
    return Promise.resolve("fallback:" + h);
  }

  var pendingPhotos = [];
  function renderPhotoThumbs() {
    var el = document.getElementById("photoThumbs");

      return '<div class="photo-thumb"><img src="' + p.dataUrl + '" alt=""><button type="button" class="photo-remove" data-idx="' + i + '">✕</button></div>';
    }).join("");

    for (var i = 0; i < btns.length; i++) {

  }
  function resizeImageFile(file, maxDim, quality, cb) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);
        cb(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = function () { showToast("사진을 불러오지 못했어요"); };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }
  function handleSelectedFiles(fileList) {
    var files = Array.prototype.slice.call(fileList);
    files.forEach(function (file) {
      if (!/^image\//.test(file.type)) return;
      var currentUsed = estimateDocSize(state);
      var pendingBytes = pendingPhotos.reduce(function (n, p) { return n + byteLength(p.dataUrl); }, 0);
      if (currentUsed + pendingBytes > STORAGE_LIMIT_BYTES * 0.95) {
        showToast("저장공간이 부족해서 더 이상 사진을 첨부할 수 없어요");
        return;
      }
      resizeImageFile(file, 1000, 0.72, function (dataUrl) {
        var projected = estimateDocSize(state) + pendingPhotos.reduce(function (n, p) { return n + byteLength(p.dataUrl); }, 0) + byteLength(dataUrl);
        if (projected > STORAGE_LIMIT_BYTES * 0.95) {
          showToast("저장공간이 부족해서 이 사진은 첨부되지 않았어요");
          return;
        }
        pendingPhotos.push({ id: uid(), name: file.name || ("photo_" + uid() + ".jpg"), dataUrl: dataUrl });
        renderPhotoThumbs();
      });
    });
  }

  function currentAttLocPayload() {
    var s = attLocationState;
    if (s.status !== "ok") return null;
    return { lat: s.lat, lng: s.lng, accuracy: s.accuracy, distance: Math.round(s.distance) };
  }

  // ---- GPS-fallback face photo verification (mobile camera only, no gallery, no PC) ----
  var pendingAttPhoto = null; // { dataUrl, capturedAt } — set once a selfie has been captured for this action
  function isMobileDevice() {
    var ua = (window.navigator && navigator.userAgent) || "";
    if (/Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua)) return true;
    // iPadOS 13+ reports its UA as a Mac, so fall back to a touch-points check.
    if (window.navigator && navigator.maxTouchPoints > 1 && /Macintosh/i.test(ua)) return true;
    return false;
  }
  function formatStampDateTime(ts) {
    var d = new Date(ts);
    function p2(n) { return n < 10 ? "0" + n : "" + n; }
    return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) +
      " (" + WEEKDAY_LABELS[d.getDay()] + ") " + p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
  }
  function openFaceCameraModal(onCapture) {
    if (!isMobileDevice()) { showToast("이 기능은 모바일에서만 사용할 수 있어요"); return; }
    if (!(window.navigator && navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
      showToast("이 기기·브라우저는 카메라를 사용할 수 없어요");
      return;
    }
    var overlay = document.createElement("div");
    overlay.className = "face-cam-overlay";
    overlay.innerHTML =
      '<div class="face-cam-topbar"><span>📷 얼굴 사진 촬영</span><button type="button" class="face-cam-close" data-cam-close>✕</button></div>' +
      '<div class="face-cam-msg" data-cam-msg>카메라를 여는 중…</div>' +
      '<video class="face-cam-video" autoplay playsinline muted style="display:none"></video>' +
      '<img class="face-cam-preview" style="display:none">' +
      '<div class="face-cam-controls" style="display:none" data-cam-controls></div>';
    document.body.appendChild(overlay);

    var video = overlay.querySelector("video");
    var previewImg = overlay.querySelector(".face-cam-preview");
    var msgEl = overlay.querySelector("[data-cam-msg]");
    var controls = overlay.querySelector("[data-cam-controls]");
    var stream = null;

    function stopStream() {
      if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    }
    function close() {
      stopStream();
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }
    overlay.querySelector("[data-cam-close]").addEventListener("click", close);

    function showShutter() {
      controls.style.display = "flex";
      controls.innerHTML = '<button type="button" class="face-cam-shutter" data-cam-shutter></button>';
      controls.querySelector("[data-cam-shutter]").addEventListener("click", capture);
    }
    function showConfirm(dataUrl) {
      controls.style.display = "flex";
      controls.innerHTML =
        '<button type="button" class="face-cam-btn2 retake" data-cam-retake>다시 찍기</button>' +
        '<button type="button" class="face-cam-btn2 use" data-cam-use>이 사진 사용</button>';
      controls.querySelector("[data-cam-retake]").addEventListener("click", function () {
        previewImg.style.display = "none";
        video.style.display = "block";
        showShutter();
      });
      controls.querySelector("[data-cam-use]").addEventListener("click", function () {
        close();
        onCapture(dataUrl);
      });
    }
    function capture() {
      var vw = video.videoWidth || 640, vh = video.videoHeight || 480;
      var maxDim = 800;
      var scale = Math.min(1, maxDim / Math.max(vw, vh));
      var cw = Math.max(1, Math.round(vw * scale)), ch = Math.max(1, Math.round(vh * scale));
      var canvas = document.createElement("canvas");
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, cw, ch);
      var stamp = formatStampDateTime(Date.now());
      var barH = Math.max(26, Math.round(ch * 0.09));
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, ch - barH, cw, barH);
      ctx.fillStyle = "#ffffff";
      ctx.font = "700 " + Math.round(barH * 0.46) + "px sans-serif";
      ctx.textBaseline = "middle";
      ctx.textAlign = "center";
      ctx.fillText(stamp, cw / 2, ch - barH / 2);
      var dataUrl = canvas.toDataURL("image/jpeg", 0.75);
      video.style.display = "none";
      previewImg.src = dataUrl;
      previewImg.style.display = "block";
      showConfirm(dataUrl);
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false }).then(function (s) {
      if (!overlay.parentNode) { s.getTracks().forEach(function (t) { t.stop(); }); return; } // closed while awaiting permission
      stream = s;
      video.srcObject = stream;
      video.style.display = "block";
      msgEl.style.display = "none";
      showShutter();
    }).catch(function () {
      msgEl.textContent = "카메라 권한을 허용해주세요. 브라우저 설정에서 카메라 접근을 켜야 촬영할 수 있어요.";
      controls.style.display = "flex";
      controls.innerHTML = '<button type="button" class="face-cam-btn2 retake" data-cam-close2>닫기</button>';
      controls.querySelector("[data-cam-close2]").addEventListener("click", close);
    });
  }

  function clockIn() {
    var account = currentAccount();
    if (!account) { showToast("로그인이 필요해요"); renderInputView(); return; }
    var workerId = account.workerId;
    var team = document.getElementById("aTeam").value;
    var geo = getAttGeo(state);
    var geoOk = attLocationState.status === "ok" && attLocationState.within;
    var geoFailed = geo.enabled && (attLocationState.status === "error" || attLocationState.status === "unsupported");
    if (geo.enabled && !geoOk && !(geoFailed && pendingAttPhoto)) {
      showToast("지정 현장 반경 안에서만 출근할 수 있어요");
      return;
    }
    if (!state.attendance) state.attendance = [];
    var already = state.attendance.some(function (r) { return r.workerId === workerId && !r.clockOutAt; });
    if (already) { showToast("이미 출근 중이에요"); renderInputView(); return; }

    if (pendingAttPhoto) {
      var readyPhoto = pendingAttPhoto.dataUrl;
      pendingAttPhoto = null;
      finishClockIn(workerId, team, readyPhoto);
    } else {
      // Reached with GPS OK (within radius) or geofencing disabled — take a fresh face photo now.
      openFaceCameraModal(function (dataUrl) { finishClockIn(workerId, team, dataUrl); });
    }
  }

  function finishClockIn(workerId, team, photoDataUrl) {
    var record = {
      id: uid(), workerId: workerId, team: team, date: todayStr(), clockInAt: Date.now(), clockOutAt: null,
      clockInLoc: currentAttLocPayload(),
      clockInPhoto: photoDataUrl || null
    };
    state.attendance.unshift(record);
    var btn = document.getElementById("btnClockIn");
    if (btn) { btn.disabled = true; btn.textContent = "저장 중…"; }
    persist(function (ok) {
      if (ok) showToast("출근이 기록됐어요");
      renderInputView();
    });
  }

  function clockOut(recordId) {
    if (!state.attendance) return;
    var record = state.attendance.filter(function (r) { return r.id === recordId; })[0];
    if (!record) return;
    var geo = getAttGeo(state);
    var geoOk = attLocationState.status === "ok" && attLocationState.within;
    var geoFailed = geo.enabled && (attLocationState.status === "error" || attLocationState.status === "unsupported");
    if (geo.enabled && !geoOk && !(geoFailed && pendingAttPhoto)) {
      showToast("지정 현장 반경 안에서만 퇴근할 수 있어요");
      return;
    }

    if (pendingAttPhoto) {
      var readyPhoto = pendingAttPhoto.dataUrl;
      pendingAttPhoto = null;
      finishClockOut(record, readyPhoto);
    } else {
      openFaceCameraModal(function (dataUrl) { finishClockOut(record, dataUrl); });
    }
  }

  function finishClockOut(record, photoDataUrl) {
    record.clockOutAt = Date.now();
    record.clockOutLoc = currentAttLocPayload();
    record.clockOutPhoto = photoDataUrl || null;
    var btn = document.getElementById("btnClockOut");
    if (btn) { btn.disabled = true; btn.textContent = "저장 중…"; }
    persist(function (ok) {

  function doLogin() {
    var id = document.getElementById("authId").value.trim();
    var pw = document.getElementById("authPw").value;
    if (!id || !pw) { authError = "아이디와 비밀번호를 입력해주세요"; renderInputView(); return; }
    var account = getAccount(state, id);
    if (!account) { authError = "존재하지 않는 아이디예요"; renderInputView(); return; }
    authBusy = true; authError = ""; renderInputView();
    hashPassword(id, pw).then(function (hash) {
      authBusy = false;
      if (hash !== account.passwordHash) {
        authError = "비밀번호가 올바르지 않아요";
        renderInputView();
        return;
      }
      setLoggedInWorkerId(id);
      showToast(id + "님, 환영해요");
      renderInputView();
    });
  }

  function doSignup() {
    var id = document.getElementById("authId").value.trim();
    var pw = document.getElementById("authPw").value;
    var pw2 = document.getElementById("authPw2").value;
    var phone = document.getElementById("authPhone").value.trim();
    var role = document.getElementById("authRole").value;
    var teamSel = document.getElementById("authTeam").value;
    var team = teamSel;
    if (!id) { authError = "아이디를 입력해주세요"; renderInputView(); return; }
    if (getAccount(state, id)) { authError = "이미 사용 중인 아이디예요"; renderInputView(); return; }
    if (!pw || pw.length < 4) { authError = "비밀번호는 4자 이상으로 입력해주세요"; renderInputView(); return; }
    if (pw !== pw2) { authError = "비밀번호가 서로 달라요"; renderInputView(); return; }
    if (!phone) { authError = "휴대폰 번호를 입력해주세요"; renderInputView(); return; }
    if (teamSel === "__new__") {
      var nv = document.getElementById("authTeamNew").value.trim();
      if (!nv) { authError = "새 팀 이름을 입력해주세요"; renderInputView(); return; }
      team = nv;
    }
    authBusy = true; authError = ""; renderInputView();
    hashPassword(id, pw).then(function (hash) {
      if (!state.accounts) state.accounts = {};
      state.accounts[id] = { workerId: id, passwordHash: hash, phone: phone, role: role, team: team, createdAt: Date.now() };
      if (state.teams.indexOf(team) < 0) state.teams.push(team);
      persist(function (ok) {
        authBusy = false;
        if (!ok) { authError = "가입 저장에 실패했어요. 인터넷 연결을 확인해주세요"; renderInputView(); return; }
        setLoggedInWorkerId(id);
        showToast("가입됐어요. 환영해요, " + id + "님");
        renderInputView();
      });
    });
  }

  // ---- admin geofence map (interactive: click / drag the marker to move the site center) ----
  var adminMapInstance = null;
  var adminMapMarker = null;
  var adminMapCircle = null;
  function initAdminGeoMap() {
    var container = document.getElementById("attGeoMap");
    if (!container) return;
    if (!window.L) {
      ensureLeaflet(function () {
        if (window.L) { initAdminGeoMap(); return; }
        var c = document.getElementById("attGeoMap");
        if (c) c.innerHTML = '<div class="att-map-fallback">지도를 불러오지 못했어요 (오프라인이거나 네트워크가 차단됨)<br>아래 위도·경도 값을 직접 입력해주세요.</div>';
      });
      return;
    }
    ensureAttGeoDraft(state);
    var geo = attGeoDraft;

    var map = L.map(container, { attributionControl: false }).setView([geo.lat, geo.lng], 16);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
    var marker = L.marker([geo.lat, geo.lng], { draggable: true }).addTo(map);
    var circle = L.circle([geo.lat, geo.lng], { radius: geo.radius, color: "#E8630A", fillColor: "#E8630A", fillOpacity: 0.12, weight: 2 }).addTo(map);
    adminMapInstance = map; adminMapMarker = marker; adminMapCircle = circle;

    function setCenter(lat, lng) {
      attGeoDraft.lat = lat; attGeoDraft.lng = lng;
      marker.setLatLng([lat, lng]);
      circle.setLatLng([lat, lng]);
      var latEl = document.getElementById("attGeoLat"); if (latEl) latEl.value = lat.toFixed(6);
      var lngEl = document.getElementById("attGeoLng"); if (lngEl) lngEl.value = lng.toFixed(6);
    }

    map.on("click", function (e) { setCenter(e.latlng.lat, e.latlng.lng); });
    marker.on("dragend", function () { var p = marker.getLatLng(); setCenter(p.lat, p.lng); });

    var latInput = document.getElementById("attGeoLat");
    var lngInput = document.getElementById("attGeoLng");
    [latInput, lngInput].forEach(function (el) {
      if (!el) return;
      el.addEventListener("change", function () {
        var lat = parseFloat(latInput.value), lng = parseFloat(lngInput.value);
        if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
          setCenter(lat, lng);
          map.setView([lat, lng]);
        }
      });
    });

    var radiusInput = document.getElementById("attGeoRadius");
    if (radiusInput) {
      radiusInput.addEventListener("input", function () {
        var r = parseFloat(this.value);
        if (!isNaN(r) && r > 0) { attGeoDraft.radius = r; circle.setRadius(r); }
      });
    }

    var locateBtn = document.getElementById("btnAttGeoLocate");
    if (locateBtn) {

  function initWorkerGeoMap() {
    var container = document.getElementById("attGeoWorkerMap");
    if (!container) return;
    if (!window.L) {
      ensureLeaflet(function () {
        if (window.L) { initWorkerGeoMap(); return; }

      });
      return;
    }
    var geo = getAttGeo(state);
    var map = L.map(container, { attributionControl: false }).setView([geo.lat, geo.lng], 16);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
    L.circle([geo.lat, geo.lng], { radius: geo.radius, color: "#E8630A", fillColor: "#E8630A", fillOpacity: 0.12, weight: 2 }).addTo(map);
    L.marker([geo.lat, geo.lng]).addTo(map).bindPopup("지정 현장");
    if (attLocationState.status === "ok") {
      var within = attLocationState.within;
      var myColor = within ? "#2E7D32" : "#C0392B";
      L.circleMarker([attLocationState.lat, attLocationState.lng], {
        radius: 8, color: myColor, weight: 2, fillColor: myColor, fillOpacity: 0.9
      }).addTo(map).bindPopup("내 위치");
      try {
        var bounds = L.latLngBounds([[geo.lat, geo.lng], [attLocationState.lat, attLocationState.lng]]);
        map.fitBounds(bounds.pad(0.35));
      } catch (e) {}
    }
  }

  function saveAttGeoSettings() {

  function downloadAttendanceExcel(dateStr, teamFilter) {
    var dayRecords = getAttDayRecords(state, dateStr, teamFilter);
    if (!dayRecords.length) { showToast("이 날짜에는 출퇴근 기록이 없어요"); return; }
    ensureXlsx(function (ok) {
      if (!ok) { showToast("엑셀 기능을 불러오지 못했어요. 인터넷 연결을 확인해주세요"); return; }
      var rows = [["작업자", "소속팀", "출근", "출근확인", "퇴근", "퇴근확인", "근무시간", "상태"]];
      dayRecords.forEach(function (r) {
        var dur = r.clockOutAt ? (r.clockOutAt - r.clockInAt) : null;
        rows.push([
          r.workerId, r.team, fmtHM(r.clockInAt), attVerifyLabel(r.clockInLoc, r.clockInPhoto),
          r.clockOutAt ? fmtHM(r.clockOutAt) : "-",
          r.clockOutAt ? attVerifyLabel(r.clockOutLoc, r.clockOutPhoto) : "-",
          dur ? fmtDurationMs(dur) : "-",
          r.clockOutAt ? "퇴근완료" : "근무중"
        ]);
      });
      var ws = XLSX.utils.aoa_to_sheet(rows);
      ws["!cols"] = [{ wch: 14 }, { wch: 12 }, { wch: 9 }, { wch: 10 }, { wch: 9 }, { wch: 10 }, { wch: 12 }, { wch: 10 }];
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "출퇴근");
      var wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      var blob = new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      saveBlobAsFile(blob, "출퇴근_" + dateStr + (teamFilter && teamFilter !== "all" ? "_" + teamFilter : "") + ".xlsx").then(function () {
        showToast("엑셀 파일을 다운로드했어요");
      }).catch(function (err) {
        if (err && err.code === "declined") return;
        showToast("다운로드에 실패했어요");
      });
    });
  }
  function downloadAttendancePhotosZip(dateStr, teamFilter) {
    var dayRecords = getAttDayRecords(state, dateStr, teamFilter);
    var items = [];
    dayRecords.forEach(function (r) {
      if (r.clockInPhoto) items.push({ name: (r.workerId || "worker") + "_출근_" + fmtHM(r.clockInAt).replace(":", "") + ".jpg", dataUrl: r.clockInPhoto });
      if (r.clockOutPhoto) items.push({ name: (r.workerId || "worker") + "_퇴근_" + fmtHM(r.clockOutAt).replace(":", "") + ".jpg", dataUrl: r.clockOutPhoto });
    });
    if (!items.length) { showToast("이 날짜에는 저장된 얼굴 사진이 없어요"); return; }
    ensureJszip(function (ok) {
      if (!ok) { showToast("압축 기능을 불러오지 못했어요. 인터넷 연결을 확인해주세요"); return; }
      var zip = new JSZip();
      var folder = zip.folder(dateStr);
      var usedNames = {};
      items.forEach(function (it) {
        var name = it.name;
        if (usedNames[name]) {
          usedNames[name]++;
          name = name.replace(/\.jpg$/, "_" + usedNames[it.name] + ".jpg");
        } else {
          usedNames[name] = 1;
        }
        var base64 = it.dataUrl.split(",")[1] || "";
        folder.file(name, base64, { base64: true });
      });
      zip.generateAsync({ type: "blob" }).then(function (blob) {
        return saveBlobAsFile(blob, dateStr + ".zip");
      }).then(function () {
        showToast("사진을 zip으로 다운로드했어요. 압축을 풀면 '" + dateStr + "' 폴더가 만들어져요");
      }).catch(function (err) {
        if (err && err.code === "declined") return;
        showToast("다운로드에 실패했어요");
      });
    });
  }

  }

      if (!nv) { showToast("새 팀 이름을 입력해주세요"); return; }
      team = nv;
      if (state.teams.indexOf(team) < 0) state.teams.push(team);
    }

    var entry = {
      id: uid(), team: team, workerId: workerId, role: role,
      date: document.getElementById("fDate").value || todayStr(),
      shift: document.getElementById("fShift").value || "day",
      site: document.getElementById("fSite").value,
      floor: document.getElementById("fFloor").value.trim(),
      location: {
        xFrom: num("fLocXFrom"), xTo: num("fLocXTo"),
        yFrom: num("fLocYFrom"), yTo: num("fLocYTo"),
        room: document.getElementById("fLocRoom").value.trim()
      },
      roles: { manager: num("fRoleManager"), supervisor: num("fRoleSupervisor"), guide: num("fRoleGuide") },
      personnel: num("fRoleManager") + num("fRoleSupervisor") + num("fRoleGuide"),
      manHours: num("fManHours"),
      duct: { anchor: num("qDuctAnchor"), channel: num("qDuctChannel"), duct: num("qDuctDuct"), fitting: num("qDuctFitting") },
      conduit: { channel: num("qConduitChannel"), pipe: num("qConduitPipe") },
      cable: { cut: num("qCableCut"), layout: num("qCableLayout"), wire: num("qCableWire") },
      instrument: { point: num("qInstPoint"), ycard: num("qInstYcard"), rework: num("qInstRework"), ycardReason: document.getElementById("qInstYcardReason").value.trim() },
      defect: { qty: num("fDefectQty"), type: document.getElementById("fDefectType").value },
      note: document.getElementById("fNote").value.trim(),
      nextDayPlan: role === LEAD_ROLE ? {
        zone: document.getElementById("fNextZone").value,
        floor: document.getElementById("fNextFloor").value.trim(),
        rows: document.getElementById("fNextRows").value.trim(),
        room: document.getElementById("fNextRoom").value.trim(),
        content: document.getElementById("fNextContent").value.trim()
      } : null,
      photos: pendingPhotos.slice(),
      createdAt: Date.now()
    };
    state.entries.unshift(entry);

    var btn = document.getElementById("btnSubmit");
    btn.disabled = true; btn.textContent = "저장 중…";

    persist(function (ok) {
      btn.disabled = false; btn.textContent = "오늘 실적 저장";
      if (ok) {
        pendingPhotos = [];
        showToast("저장됐어요 · 대시보드에 반영됩니다");
        renderInputView(); renderDashView();
      }
    });
  }

  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  function renderFullDocument(st) {
    var cssText = document.getElementById("app-css").textContent;
    var srcText = document.getElementById("app-src").textContent;
    return '<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      "<title>현장 생산성 기록</title>\n" +
      '<style id="app-css">' + cssText + "</style>\n" +
      "</head>\n<body>\n" +
      '<div class="shell">' +
        '<div class="masthead">' +
          '<div class="brand"><span class="mark">현</span><div><h1>현장 생산성 기록</h1>' +
          '<div class="sub">전기·통신 시공 현장 — 투입인원 · 시공물량 관리</div></div></div>' +
          '<div class="sync-note" id="syncNote"><span class="sync-dot" id="syncDot"></span><span id="syncText">동기화 확인 중…</span></div>' +
        "</div>" +
        '<div class="toggle" role="tablist" artifact-local>' +
          '<button type="button" id="tabInput" class="active" role="tab">📱 현장 입력</button>' +
          '<button type="button" id="tabDash" role="tab">🖥 관리자 대시보드</button>' +
        "</div>" +
        '<div id="viewInput" class="view active">' + buildInputViewHtml(st) + "</div>" +
        '<div id="viewDash" class="view">' + buildDashViewHtml(st, currentDashPage, currentDashDateFilter) + "</div>" +
      "</div>" +
      '<div class="toast" id="toast"></div>' +
      '<script id="app-state" type="application/json">' + JSON.stringify(st) + "<" + "/script>\n" +
      '<script id="app-src" type="text/plain">' + srcText + "<" + "/script>\n" +
      '<script>(function(){var s=document.getElementById("app-src").textContent;(0,eval)(s);})();<' + "/script>\n" +
      "</body>\n</html>";
  }

  function persist(cb) {
    if (firebaseDb) {
      firebaseDb.ref("state").set(state).then(function () {
        cb(true);
      }).catch(function () {
        showToast("저장에 실패했어요. 인터넷 연결을 확인해주세요");
        cb(false);
      });
      return;
    }
    if (!artifactApi) { cb(true); return; }
    artifactApi.publish(renderFullDocument(state)).then(function () {
      cb(true);
    }).catch(function (err) {
      if (err && err.code === "conflict") { return; }
      if (err && (err.code === "not_writer" || err.code === "not_granted")) {
        isWriter = false;
        setSyncStatus(false, "읽기 전용 보기");
        showToast("이 보기는 읽기 전용이라 저장할 수 없어요");
      } else if (err && err.code === "too_large") {
        showToast("사진 용량이 너무 커요. 사진 수를 줄이고 다시 시도해주세요");
      } else {
        showToast("저장에 실패했어요. 다시 시도해주세요");
      }
      cb(false);
    });
  }

  function setSyncStatus(on, label) {
    var dot = document.getElementById("syncDot");
    var txt = document.getElementById("syncText");
    if (dot) dot.classList.toggle("off", !on);
    if (txt) txt.textContent = label;
  }

  function initTabs() {
    var tIn = document.getElementById("tabInput");
    var tDa = document.getElementById("tabDash");
    var vIn = document.getElementById("viewInput");
    var vDa = document.getElementById("viewDash");
    tIn.addEventListener("click", function () {
      tIn.classList.add("active"); tDa.classList.remove("active");
      vIn.classList.add("active"); vDa.classList.remove("active");
    });
    tDa.addEventListener("click", function () {
      tDa.classList.add("active"); tIn.classList.remove("active");
      vDa.classList.add("active"); vIn.classList.remove("active");
    });
  }

  function boot() {
    initTabs();
    renderInputView();
    renderDashView();
    initDashDelegation();

    initFirebaseSync(); // shared cross-device storage; falls back gracefully below if it can't load (e.g. blocked network)

    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("artifact").then(function (api) {
        artifactApi = api;
        setSyncStatus(!!api, api ? "홈페이지와 실시간 동기화" : "미리보기 모드 (저장 안 됨)");
      }).catch(function () {
        setSyncStatus(false, "미리보기 모드 (저장 안 됨)");
      });
      window.claude.use("downloads").then(function (api) {
        downloadsApi = api;
      }).catch(function () {});
    } else {
      setSyncStatus(false, "미리보기 모드 (저장 안 됨)");
    }
  }

  boot();
})();
</script>
<script>(function(){var s=document.getElementById("app-src").textContent;(0,eval)(s);})();</script>
