    // 관리자는 발주서 목록에서 상태만 확인하고, 실제 입고 확인은 창고장님이 눌러요.
    Array.prototype.forEach.call(document.querySelectorAll("[data-req-topo]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-req-topo");
        var req = (state.materialRequests || []).filter(function (r) { return r.id === id; })[0];
        if (!req) return;
        // 실제 발주서는 아직 만들지 않는다 — 아래 "발주 요청"에서 업체·납기일을 정해 "발주완료" 처리해야 진짜 발주서가 된다.
        req.status = "발주요청";
        req.orderRequestedAt = Date.now();
        persist(function (ok) { if (ok) { showToast("발주가 필요하다고 표시했어요"); renderDashView(); } });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-req-complete]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-req-complete");
        var req = (state.materialRequests || []).filter(function (r) { return r.id === id; })[0];
        if (!req) return;
        var vendorInput = document.getElementById("reqVendor_" + id);
        var expectedInput = document.getElementById("reqExpected_" + id);
        var vendor = vendorInput ? vendorInput.value.trim() : "";
        var expectedDate = expectedInput ? expectedInput.value : "";
        if (!vendor) { showToast("업체명을 입력해주세요"); return; }
        var site = findSite(state, req.siteId);
        state.purchaseOrders.push({
          id: uid(), siteId: req.siteId, siteName: site ? site.name : "", vendor: vendor,
          orderDate: todayStr(), expectedDate: expectedDate, status: "발주됨",
          items: [{ name: req.name, spec: req.spec, qty: req.qty, unit: req.unit || "", note: req.note || "" }],
          createdAt: Date.now(), fromRequestId: req.id
        });
        req.status = "발주완료";
        req.vendor = vendor;
        req.expectedDate = expectedDate;
        req.resolvedAt = Date.now();
        persist(function (ok) { if (ok) { showToast("발주완료 처리했어요"); renderDashView(); } });
      });
    });
  }
  // ================= 근로계약서 전자서명 (월정직 / 관리자용) =================
  // 엑셀 워크북 구조: 첫 시트는 빈 템플릿, 그 뒤로 워커별 시트(시트명 = 이름)가 이어진다.
  // 각 워커 시트는 셀 좌표가 완전히 고정돼 있어서(청섭님 회사 양식 기준) 좌표로 바로 읽는다.
  var MONTHLY_CONTRACT_CELLS = {
    company: "H3", siteName: "S3", name: "H4", residentNum: "S4",
    address: "H5", phone: "V5", contractStart: "H8", contractEnd: "P8",
    monthlyWageTotal: "P16", wageBase: "H18", wageWeekly: "K18", wageOvertime: "P18",
    wageAnnual: "T18", wageHoliday: "X18", contractDateLine: "A62",
    companyRepLine: "A65"
  };
  function normalizePhoneDigits(s) { return (s || "").toString().replace(/[^0-9]/g, ""); }
  function cellVal(ws, ref) {
    var c = ws[ref];
    return c && c.v != null ? c.v : "";
  }
  // 시트 하나를 파싱해서 워커 계약 데이터로 변환. 이름/주민번호가 없으면 워커 시트가 아니라고 보고 null.
  function parseMonthlyContractSheet(sheetName, ws) {
    var name = (cellVal(ws, MONTHLY_CONTRACT_CELLS.name) || "").toString().replace(/\s+/g, "");
    var residentNum = cellVal(ws, MONTHLY_CONTRACT_CELLS.residentNum);
    if (!name || !residentNum) return null;
    var c = {};
    Object.keys(MONTHLY_CONTRACT_CELLS).forEach(function (k) { c[k] = cellVal(ws, MONTHLY_CONTRACT_CELLS[k]); });
    c.sheetName = sheetName;
    c.name = name;
    return c;
  }
  function findAccountByPhone(st, phone) {
    var digits = normalizePhoneDigits(phone);
    if (!digits) return null;
    var accounts = st.accounts || {};
    var found = Object.keys(accounts).filter(function (id) { return normalizePhoneDigits(accounts[id].phone) === digits; });
    return found.length ? accounts[found[0]] : null;
  }

  // 일용직(1주 40시간) 근로계약서 양식 셀 좌표. 박남원팀/서창우팀/유도원 3개 팀, 총 7명 워커 시트를 대조해 확인함.
  var DAILY_CONTRACT_CELLS = {
    company: "H3", siteName: "S3", name: "H4", residentNum: "S4",
    address: "H5", phone: "V5", contractStart: "H8", contractEnd: "P8",
    dailyWage: "P18", wageHourly: "D20", wageBase: "H20", wageWeekly: "L20",
    wageOvertime: "P20", wageAnnual: "T20", wageHoliday: "X20",
    bankInfoRaw: "D32", contractDateLine: "A71"
  };
  // D32 예시: '2. "을"의 본인계좌 지정하여 통보한 온라인통장구좌 (  9002-1345-9699-7   , 새마을금고  은행)로 지급한다.'
  // 계좌번호/은행명이 자유 텍스트 안에 박혀있어서 정규식으로 뽑아낸다. (팀 3곳 7명 전부 같은 패턴 확인함)
  function parseBankInfoFromText(raw) {
    var m = (raw || "").toString().match(/\(([^,]+),\s*([^,]+?)\s*은행\)/);
    if (!m) return { accountNumber: "", bankName: "" };
    return { accountNumber: m[1].replace(/\s+/g, ""), bankName: m[2].replace(/\s+/g, "") };
  }
  function parseDailyContractSheet(sheetName, ws) {
    var name = (cellVal(ws, DAILY_CONTRACT_CELLS.name) || "").toString().replace(/\s+/g, "");
    var residentNum = cellVal(ws, DAILY_CONTRACT_CELLS.residentNum);
    if (!name || !residentNum) return null;
    var c = {};
    Object.keys(DAILY_CONTRACT_CELLS).forEach(function (k) { c[k] = cellVal(ws, DAILY_CONTRACT_CELLS[k]); });
    c.sheetName = sheetName;
    c.name = name;
    var bank = parseBankInfoFromText(c.bankInfoRaw);
    c.bankAccountNumber = bank.accountNumber;
    c.bankName = bank.bankName;
    return c;
  }
  function parseContractSheet(contractType, sheetName, ws) {
    return contractType === "daily" ? parseDailyContractSheet(sheetName, ws) : parseMonthlyContractSheet(sheetName, ws);
  }

  var contractUploadPreview = null; // [{sheetName, contract, account}] — 업로드 직후 매칭 결과를 확정 발송 전까지 보여준다.
  var contractUploadType = "monthly"; // "monthly" | "daily" — 업로드 시 선택한 계약서 종류
  var contractsPageCurrent = 1;
  var contractsPageSize = 10;

  function buildContractsAdminPageHtml(st) {
    var list = (st.laborContracts || []).slice().sort(function (a, b) { return (b.uploadedAt || 0) - (a.uploadedAt || 0); });
    var previewHtml = "";
    if (contractUploadPreview) {
      var rows = contractUploadPreview.map(function (row, idx) {
        var matchHtml = row.account
          ? '<span class="settings-tag" style="color:var(--good)">✓ ' + escapeHtml(row.account.name || row.account.workerId) + " (" + escapeHtml(row.account.workerId) + ")</span>"
          : '<span class="settings-tag" style="color:var(--bad)">전화번호로 매칭되는 계정 없음</span>';
        return '<tr><td>' + escapeHtml(row.sheetName) + "</td><td>" + escapeHtml(row.contract.name) + "</td><td>" + escapeHtml(row.contract.phone || "") + "</td><td>" + matchHtml + "</td></tr>";
      }).join("");
      var matchedCount = contractUploadPreview.filter(function (r) { return r.account; }).length;
      previewHtml = '<div class="panel"><h2 style="margin:0 0 10px">업로드 미리보기 (' + matchedCount + "/" + contractUploadPreview.length + " 명 매칭됨)</h2>" +
        '<div class="panel-caption" style="margin:0 0 10px">전화번호로 앱 계정과 자동 매칭했어요. 매칭 안 된 사람은 먼저 앱에 가입시킨 뒤 다시 올려주세요.</div>' +
        '<div class="table-wrap"><table><thead><tr><th>시트명</th><th>성명</th><th>연락처</th><th>매칭 결과</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
        '<div class="modal-actions" style="justify-content:flex-start;margin-top:14px">' +
          '<button type="button" class="submit-btn" id="btnContractConfirmSend" style="max-width:220px"' + (matchedCount ? "" : " disabled") + '>매칭된 ' + matchedCount + '명에게 발송</button> ' +
          '<button type="button" class="btn-secondary" id="btnContractCancelPreview">취소</button>' +
        "</div>" +
      "</div>";
    }
    var contractsTotalPages = Math.max(1, Math.ceil(list.length / contractsPageSize));
    if (contractsPageCurrent > contractsTotalPages) contractsPageCurrent = contractsTotalPages;
    if (contractsPageCurrent < 1) contractsPageCurrent = 1;
    var contractsPageList = list.slice((contractsPageCurrent - 1) * contractsPageSize, contractsPageCurrent * contractsPageSize);
    var statusRows = list.length ? contractsPageList.map(function (row) {
      var statusHtml = row.bankConfirmStatus === "pending_correction"
        ? '<span class="settings-tag" style="color:var(--bad)">⚠ 계좌정보 확인요청</span>'
        : row.status === "서명완료"
        ? '<span class="settings-tag" style="color:var(--good)">✓ 서명완료</span>'
        : '<span class="settings-tag" style="color:var(--accent)">대기중</span>';
      var actionsHtml = row.bankConfirmStatus === "pending_correction"
        ? '<button type="button" class="account-bar-btn" data-contract-bank-review="' + row.id + '">계좌정보 확인</button>'
        : row.status === "서명완료"
        ? '<button type="button" class="account-bar-btn" data-contract-view="' + row.id + '">보기</button>'
        : '<button type="button" class="account-bar-btn" data-contract-cancel="' + row.id + '">발송취소</button>';
      var typeTag = row.type === "daily" ? '<span class="settings-tag" style="margin-left:6px">일용직</span>' : "";
      return '<tr><td>' + escapeHtml(row.contract.name) + typeTag + "</td><td>" + escapeHtml(row.contract.phone || "") + "</td><td>" + escapeHtml(row.contract.contractStart || "") + " ~ " + escapeHtml(row.contract.contractEnd || "") + "</td><td>" + statusHtml + "</td><td>" + actionsHtml + "</td></tr>";
    }).join("") : '<tr><td colspan="5" class="empty-state">아직 발송한 계약서가 없어요</td></tr>';

    return '<div class="panel-caption" style="margin:-4px 0 14px">✍️ 근로계약서 엑셀(워커별 시트)을 올리면 전화번호로 작업자 계정을 찾아 서명 요청을 보내요.</div>' +
      '<div class="panel"><h2 style="margin:0 0 10px">계약서 엑셀 업로드</h2>' +
        '<div class="panel-caption" style="margin:0 0 10px">첫 시트(빈 템플릿)는 자동으로 건너뛰어요.</div>' +
        '<div class="field" style="max-width:260px;margin-bottom:10px"><label>계약서 종류</label><select id="contractTypeSelect">' +
          '<option value="monthly"' + (contractUploadType === "monthly" ? " selected" : "") + '>월정직 (관리자) 근로계약서</option>' +
          '<option value="daily"' + (contractUploadType === "daily" ? " selected" : "") + '>일용직 (1주 40시간) 근로계약서</option>' +
        "</select></div>" +
        '<label class="account-bar-btn" for="contractFileInput" style="cursor:pointer;display:inline-block">📎 엑셀 파일 선택</label>' +
        '<input type="file" id="contractFileInput" accept=".xlsx,.xls" style="display:none">' +
        '<span id="contractFileStatus" style="margin-left:10px;color:var(--text-muted);font-size:12.5px"></span>' +
      "</div>" +
      previewHtml +
      '<div class="panel"><h2 style="margin:0 0 10px">발송 현황</h2>' +
        '<div class="table-wrap"><table><thead><tr><th>성명</th><th>연락처</th><th>계약기간</th><th>상태</th><th></th></tr></thead><tbody>' + statusRows + "</tbody></table></div>" +
        buildPaginationHtml(list.length, contractsPageSize, contractsPageCurrent, "contracts") +
      "</div>";
  }

  function wireContractsAdminPage() {
    var typeSelect = document.getElementById("contractTypeSelect");
    if (typeSelect) typeSelect.addEventListener("change", function () { contractUploadType = this.value; });
    var fileInput = document.getElementById("contractFileInput");
    if (fileInput) fileInput.addEventListener("change", function () {
      var file = this.files && this.files[0];
      this.value = "";
      if (!file) return;
      var uploadType = contractUploadType;
      var statusEl = document.getElementById("contractFileStatus");
      if (statusEl) statusEl.textContent = "읽는 중…";
      ensureXlsx(function (ok) {
        if (!ok) { if (statusEl) statusEl.textContent = ""; showToast("엑셀 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해주세요"); return; }
        var reader = new FileReader();
        reader.onload = function () {
          if (statusEl) statusEl.textContent = "";
          try {
            var wb = XLSX.read(reader.result, { type: "array" });
            var rows = [];
            wb.SheetNames.forEach(function (sn) {
              var ws = wb.Sheets[sn];
              var contract = parseContractSheet(uploadType, sn, ws);
              if (!contract) return; // 빈 템플릿 시트 등은 건너뜀
              var account = findAccountByPhone(state, contract.phone);
              rows.push({ sheetName: sn, contract: contract, account: account, contractType: uploadType });
            });
            if (!rows.length) { showToast("워커별 시트를 찾지 못했어요. 양식을 확인해주세요"); return; }
            contractUploadPreview = rows;
            renderDashView();
          } catch (e) { showToast("파일을 해석하지 못했어요. 형식을 확인해주세요"); }
        };
        reader.onerror = function () { if (statusEl) statusEl.textContent = ""; showToast("파일을 읽지 못했어요"); };
        reader.readAsArrayBuffer(file);
      });
    });
    var confirmBtn = document.getElementById("btnContractConfirmSend");
    if (confirmBtn) confirmBtn.addEventListener("click", function () {
      var matched = (contractUploadPreview || []).filter(function (r) { return r.account; });
      if (!matched.length) return;
      matched.forEach(function (row) {
        // 같은 사람에게 이미 대기중인 계약서가 있으면 새로 만들지 않고 덮어쓴다 (재발송).
        var existing = (state.laborContracts || []).filter(function (r) { return r.workerId === row.account.workerId && r.status === "대기서명"; })[0];
        if (existing) {
          existing.contract = row.contract;
          existing.type = row.contractType;
          existing.bankConfirmStatus = null;
          existing.bankCorrectionRequest = null;
          existing.uploadedAt = Date.now();
        } else {
          state.laborContracts.push({
            id: uid(), workerId: row.account.workerId, phone: row.contract.phone, type: row.contractType,
            contract: row.contract, status: "대기서명", uploadedAt: Date.now()
          });
        }
      });
      contractUploadPreview = null;
      persist(function (ok) { if (ok) { showToast(matched.length + "명에게 계약서를 발송했어요"); renderDashView(); } });
    });
    var cancelBtn = document.getElementById("btnContractCancelPreview");
    if (cancelBtn) cancelBtn.addEventListener("click", function () { contractUploadPreview = null; renderDashView(); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-contract-cancel]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-contract-cancel");
        state.laborContracts = (state.laborContracts || []).filter(function (r) { return r.id !== id; });
        persist(function (ok) { if (ok) { showToast("발송을 취소했어요"); renderDashView(); } });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-contract-view]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-contract-view");
        var row = (state.laborContracts || []).filter(function (r) { return r.id === id; })[0];
        if (row) openContractViewModal(row);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-contract-bank-review]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-contract-bank-review");
        var row = (state.laborContracts || []).filter(function (r) { return r.id === id; })[0];
        if (row) openContractBankReviewModal(row);
      });
    });
  }

  // 작업자가 "계좌가 다릅니다"라고 정정 요청한 건을 관리자가 확인하고 반영하는 모달.
  // 반영하면 계좌정보 확인 게이트를 다시 띄워서(bankConfirmStatus 초기화) 작업자가 새 정보로 다시 확인하게 한다.
  function openContractBankReviewModal(row) {
    var existing = document.getElementById("contractBankReviewOverlay");
    if (existing) existing.parentNode.removeChild(existing);
    var req = row.bankCorrectionRequest || {};
    var overlay = document.createElement("div");
    overlay.id = "contractBankReviewOverlay";
    overlay.className = "modal-overlay";
    overlay.innerHTML = '<div class="modal-card" style="max-width:480px">' +
      '<h3 style="margin:0 0 10px">' + escapeHtml(row.contract.name) + ' 계좌정보 확인요청</h3>' +
      '<div class="panel-caption" style="margin:0 0 10px">엑셀에 있던 계좌정보와 다르다고 작업자가 알려왔어요. 아래 내용을 확인하고 올바른 정보로 반영해주세요.</div>' +
      '<table class="contract-info-table" style="margin-bottom:12px">' +
        "<tr><th>엑셀 원본</th><td>" + escapeHtml(row.contract.bankName || "") + " " + escapeHtml(row.contract.bankAccountNumber || "") + "</td></tr>" +
        "<tr><th>작업자 요청</th><td>" + escapeHtml(req.bankName || "") + " " + escapeHtml(req.accountNumber || "") + "</td></tr>" +
        (req.note ? "<tr><th>메모</th><td>" + escapeHtml(req.note) + "</td></tr>" : "") +
      "</table>" +
      '<div class="field"><label>은행명</label><input type="text" id="bankReviewBankName" value="' + escapeHtml(req.bankName || row.contract.bankName || "") + '"></div>' +
      '<div class="field" style="margin-top:8px"><label>계좌번호</label><input type="text" id="bankReviewAccountNumber" value="' + escapeHtml(req.accountNumber || row.contract.bankAccountNumber || "") + '"></div>' +
      '<div class="modal-actions">' +
        '<button type="button" class="submit-btn" id="bankReviewApply" style="max-width:220px">반영하고 재확인 요청</button>' +
        '<button type="button" class="btn-secondary" id="bankReviewClose">닫기</button>' +
      "</div>" +
    "</div>";
    document.body.appendChild(overlay);
    overlay.addEventListener("click", function (ev) { if (ev.target === overlay) overlay.parentNode.removeChild(overlay); });
    document.getElementById("bankReviewClose").addEventListener("click", function () { overlay.parentNode.removeChild(overlay); });
    document.getElementById("bankReviewApply").addEventListener("click", function () {
      var bankName = document.getElementById("bankReviewBankName").value.trim();
      var accountNumber = document.getElementById("bankReviewAccountNumber").value.trim();
      if (!bankName || !accountNumber) { showToast("은행명과 계좌번호를 입력해주세요"); return; }
      row.contract.bankName = bankName;
      row.contract.bankAccountNumber = accountNumber;
      row.bankConfirmStatus = null;
      row.bankCorrectionRequest = null;
      overlay.parentNode.removeChild(overlay);
      persist(function (ok) { if (ok) { showToast("반영했어요. 작업자에게 다시 계좌 확인 요청이 안내돼요"); renderDashView(); } });
    });
  }

  function openContractViewModal(row) {
    var existing = document.getElementById("contractViewOverlay");
    if (existing) existing.parentNode.removeChild(existing);
    var overlay = document.createElement("div");
    overlay.id = "contractViewOverlay";
    overlay.className = "modal-overlay";
    overlay.innerHTML = '<div class="modal-card" style="max-width:640px;max-height:88vh">' +
      '<h3 style="margin:0 0 10px">' + escapeHtml(row.contract.name) + ' 근로계약서</h3>' +
      buildContractBodyHtml(row.type, row.contract) +
      (row.signatureDataUrl ? '<div class="contract-sig-block"><div class="contract-sig-label">서명 (' + escapeHtml(fmtDateTime(row.signedAt)) + ')</div><img src="' + row.signatureDataUrl + '" class="contract-sig-img"></div>' : "") +
      '<div class="modal-actions"><button type="button" class="btn-secondary" id="contractViewClose">닫기</button></div>' +
    "</div>";
    document.body.appendChild(overlay);
    overlay.addEventListener("click", function (ev) { if (ev.target === overlay) overlay.parentNode.removeChild(overlay); });
    document.getElementById("contractViewClose").addEventListener("click", function () { overlay.parentNode.removeChild(overlay); });
    wireWageDetailToggle(overlay);
  }
  // 임금 상세 계산 표는 평소엔 접어두고, 버튼을 눌러야 펼쳐지게 한다 (계약서·서명화면·미리보기 공통 사용).
  function wireWageDetailToggle(scopeEl) {
    var btn = scopeEl.querySelector("[data-wage-toggle]");
    var wrap = scopeEl.querySelector("#wageDetailWrap");
    if (!btn || !wrap) return;
    btn.addEventListener("click", function () {
      wrap.hidden = !wrap.hidden;
      btn.textContent = wrap.hidden ? "임금 상세 계산 보기 ▾" : "임금 상세 계산 접기 ▴";
    });

  function fmtDateTime(ts) {

  function wireSignaturePad(canvasId) {
    var canvas = document.getElementById(canvasId);
    if (!canvas) return null;
    var ratio = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, rect.width * ratio);
    canvas.height = Math.max(1, rect.height * ratio);
    var ctx = canvas.getContext && canvas.getContext("2d");
    if (!ctx) return null; // 캔버스 2D 컨텍스트를 지원하지 않는 환경(구형 브라우저 등) 방어
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.4;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#111827";
    var drawing = false, hasDrawn = false, lastX = 0, lastY = 0;
    function posFromEvent(e) {
      var r = canvas.getBoundingClientRect();
      var cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
      var cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
      return { x: cx - r.left, y: cy - r.top };
    }
    function start(e) { e.preventDefault(); drawing = true; var p = posFromEvent(e); lastX = p.x; lastY = p.y; }
    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      var p = posFromEvent(e);
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
      lastX = p.x; lastY = p.y; hasDrawn = true;
    }
    function end(e) { drawing = false; }
    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);
    canvas.addEventListener("touchstart", start, { passive: false });
    canvas.addEventListener("touchmove", move, { passive: false });
    canvas.addEventListener("touchend", end);
    return {
      clear: function () { ctx.clearRect(0, 0, canvas.width, canvas.height); hasDrawn = false; },
      isEmpty: function () { return !hasDrawn; },
      toDataURL: function () { return canvas.toDataURL("image/png"); }
    };
  }

  // Simple client-side hash (SHA-256 of id+password) so passwords aren't stored as plain text in Firebase.
  // Note: this is a basic deterrent, not strong security — the Firebase database itself should be locked down
  // (not left in open "test mode") once the team is set up, since anyone with the DB URL can otherwise read this.
  function hashPassword(workerId, password) {
    var input = (workerId || "").toLowerCase() + "::sitelog::" + (password || "");
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      var bytes = new TextEncoder().encode(input);
      return crypto.subtle.digest("SHA-256", bytes).then(function (buf) {
        var arr = Array.prototype.slice.call(new Uint8Array(buf));
        return arr.map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
      });
    }
    // very old browsers without SubtleCrypto: fall back to a weak numeric hash rather than plain text
    var h = 0;
    for (var i = 0; i < input.length; i++) { h = ((h << 5) - h + input.charCodeAt(i)) | 0; }
    return Promise.resolve("fallback:" + h);
  }

  function resizeImageFile(file, maxDim, quality, cb) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);
        cb(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = function () { showToast("사진을 불러오지 못했어요"); };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }
  function handleSelectedFiles(fileList) {
    var files = Array.prototype.slice.call(fileList);
    files.forEach(function (file) {
      if (!/^image\//.test(file.type)) return;
      var currentUsed = estimateDocSize(state);
      var pendingBytes = pendingPhotos.reduce(function (n, p) { return n + byteLength(p.dataUrl); }, 0);
      if (currentUsed + pendingBytes > STORAGE_LIMIT_BYTES * 0.95) {
        showToast("저장공간이 부족해서 더 이상 사진을 첨부할 수 없어요");
        return;
      }
      resizeImageFile(file, 1000, 0.72, function (dataUrl) {
        var projected = estimateDocSize(state) + pendingPhotos.reduce(function (n, p) { return n + byteLength(p.dataUrl); }, 0) + byteLength(dataUrl);
        if (projected > STORAGE_LIMIT_BYTES * 0.95) {
          showToast("저장공간이 부족해서 이 사진은 첨부되지 않았어요");
          return;
        }
        pendingPhotos.push({ id: uid(), name: file.name || ("photo_" + uid() + ".jpg"), dataUrl: dataUrl });
        renderPhotoThumbs();
      });
    });
  }

  function formatStampDateTime(ts) {

      " (" + WEEKDAY_LABELS[d.getDay()] + ") " + p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());

  function openFaceCameraModal(onCapture) {

    function showShutter() {
      controls.style.display = "flex";
      controls.innerHTML = '<button type="button" class="face-cam-shutter" data-cam-shutter></button>';
      controls.querySelector("[data-cam-shutter]").addEventListener("click", capture);
    }
    function showConfirm(dataUrl) {
      controls.style.display = "flex";
      controls.innerHTML =
        '<button type="button" class="face-cam-btn2 retake" data-cam-retake>다시 찍기</button>' +
        '<button type="button" class="face-cam-btn2 use" data-cam-use>이 사진 사용</button>';
      controls.querySelector("[data-cam-retake]").addEventListener("click", function () {
        previewImg.style.display = "none";
        video.style.display = "block";
        showShutter();
      });
      controls.querySelector("[data-cam-use]").addEventListener("click", function () {
        close();
        onCapture(dataUrl);
      });
    }
    function capture() {
      var vw = video.videoWidth || 640, vh = video.videoHeight || 480;
      var maxDim = 800;
      var scale = Math.min(1, maxDim / Math.max(vw, vh));
      var cw = Math.max(1, Math.round(vw * scale)), ch = Math.max(1, Math.round(vh * scale));
      var canvas = document.createElement("canvas");
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, cw, ch);
      var stamp = formatStampDateTime(Date.now());
      var barH = Math.max(26, Math.round(ch * 0.09));
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, ch - barH, cw, barH);
      ctx.fillStyle = "#ffffff";
      ctx.font = "700 " + Math.round(barH * 0.46) + "px sans-serif";
      ctx.textBaseline = "middle";
      ctx.textAlign = "center";
      ctx.fillText(stamp, cw / 2, ch - barH / 2);
      var dataUrl = canvas.toDataURL("image/jpeg", 0.75);
      video.style.display = "none";
      previewImg.src = dataUrl;
      previewImg.style.display = "block";
      showConfirm(dataUrl);
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false }).then(function (s) {
      if (!overlay.parentNode) { s.getTracks().forEach(function (t) { t.stop(); }); return; } // closed while awaiting permission
      stream = s;
      video.srcObject = stream;
      video.style.display = "block";
      msgEl.style.display = "none";
      showShutter();
    }).catch(function () {
      msgEl.textContent = "카메라 권한을 허용해주세요. 브라우저 설정에서 카메라 접근을 켜야 촬영할 수 있어요.";
      controls.style.display = "flex";
      controls.innerHTML = '<button type="button" class="face-cam-btn2 retake" data-cam-close2>닫기</button>';
      controls.querySelector("[data-cam-close2]").addEventListener("click", close);
    });
  }

  function clockIn() {
    var account = currentAccount();
    if (!account) { showToast("로그인이 필요해요"); renderInputView(); return; }
    var workerId = account.workerId;
    var team = document.getElementById("aTeam").value;
    var geo = getAttGeo(state);
    var geoOk = attLocationState.status === "ok" && attLocationState.within;
    var geoFailed = geo.enabled && (attLocationState.status === "error" || attLocationState.status === "unsupported");
    if (geo.enabled && !geoOk && !(geoFailed && pendingAttPhoto)) {
      showToast("지정 현장 반경 안에서만 출근할 수 있어요");
      return;
    }
    if (!state.attendance) state.attendance = [];
    var already = state.attendance.some(function (r) { return r.workerId === workerId && !r.clockOutAt; });
    if (already) { showToast("이미 출근 중이에요"); renderInputView(); return; }

    if (pendingAttPhoto) {
      var readyPhoto = pendingAttPhoto.dataUrl;
      pendingAttPhoto = null;
      finishClockIn(workerId, team, readyPhoto);
    } else {
      // Reached with GPS OK (within radius) or geofencing disabled — take a fresh face photo now.
      openFaceCameraModal(function (dataUrl) { finishClockIn(workerId, team, dataUrl); });
    }
  }

  function finishClockIn(workerId, team, photoDataUrl) {
    var record = {
      id: uid(), workerId: workerId, team: team, date: todayStr(), clockInAt: Date.now(), clockOutAt: null,
      clockInLoc: currentAttLocPayload(),
      clockInPhoto: photoDataUrl || null
    };
    state.attendance.unshift(record);
    var btn = document.getElementById("btnClockIn");
    if (btn) { btn.disabled = true; btn.textContent = "저장 중…"; }
    persist(function (ok) {
      if (ok) showToast("출근이 기록됐어요");
      renderInputView();
    });
  }

  function clockOut(recordId) {
    if (!state.attendance) return;
    var record = state.attendance.filter(function (r) { return r.id === recordId; })[0];
    if (!record) return;
    var geo = getAttGeo(state);
    var geoOk = attLocationState.status === "ok" && attLocationState.within;
    var geoFailed = geo.enabled && (attLocationState.status === "error" || attLocationState.status === "unsupported");
    if (geo.enabled && !geoOk && !(geoFailed && pendingAttPhoto)) {
      showToast("지정 현장 반경 안에서만 퇴근할 수 있어요");
      return;
    }

    if (pendingAttPhoto) {
      var readyPhoto = pendingAttPhoto.dataUrl;
      pendingAttPhoto = null;
      finishClockOut(record, readyPhoto);
    } else {
      openFaceCameraModal(function (dataUrl) { finishClockOut(record, dataUrl); });
    }
  }

  function finishClockOut(record, photoDataUrl) {
    record.clockOutAt = Date.now();
    record.clockOutLoc = currentAttLocPayload();

  function doLogin() {
    var id = document.getElementById("authId").value.trim();
    var pw = document.getElementById("authPw").value;
    if (!id || !pw) { authError = "아이디와 비밀번호를 입력해주세요"; renderInputView(); return; }
    var account = getAccount(state, id);
    if (!account) { authError = "존재하지 않는 아이디예요"; renderInputView(); return; }
    authBusy = true; authError = ""; renderInputView();
    hashPassword(id, pw).then(function (hash) {
      authBusy = false;
      if (hash !== account.passwordHash) {
        authError = "비밀번호가 올바르지 않아요";
        renderInputView();
        return;
      }
      setLoggedInWorkerId(id);
      showToast(id + "님, 환영해요");
      renderInputView();
    });
  }

  function doSignup() {
    var id = document.getElementById("authId").value.trim();
    var name = document.getElementById("authName").value.trim();
    var pw = document.getElementById("authPw").value;
    var pw2 = document.getElementById("authPw2").value;
    var phone = document.getElementById("authPhone").value.trim();
    var role = document.getElementById("authRole").value;
    var hasSites = (state.sites && state.sites.length) ? true : false;
    var isWarehouse = role === WAREHOUSE_ROLE;
    var siteId = "", siteName = "";
    var teamSel = isWarehouse ? "" : document.getElementById("authTeam").value;
    var team = teamSel;
    if (!id) { authError = "아이디를 입력해주세요"; renderInputView(); return; }
    if (getAccount(state, id)) { authError = "이미 사용 중인 아이디예요"; renderInputView(); return; }
    if (!name) { authError = "이름을 입력해주세요"; renderInputView(); return; }
    if (!pw || pw.length < 4) { authError = "비밀번호는 4자 이상으로 입력해주세요"; renderInputView(); return; }
    if (pw !== pw2) { authError = "비밀번호가 서로 달라요"; renderInputView(); return; }
    if (!phone) { authError = "휴대폰 번호를 입력해주세요"; renderInputView(); return; }
    if (hasSites) {
      var siteSel = document.getElementById("authSite");
      siteId = siteSel ? siteSel.value : "";
      var site = findSite(state, siteId);
      if (!site) { authError = "현장을 선택해주세요"; renderInputView(); return; }
      siteName = site.name;
    }
    if (!isWarehouse && teamSel === "__new__") {
      var nv = document.getElementById("authTeamNew").value.trim();
      if (!nv) { authError = "새 팀 이름을 입력해주세요"; renderInputView(); return; }
      team = nv;
    }
    authBusy = true; authError = ""; renderInputView();
    hashPassword(id, pw).then(function (hash) {
      if (!state.accounts) state.accounts = {};
      state.accounts[id] = { workerId: id, name: name, passwordHash: hash, phone: phone, role: role, team: isWarehouse ? "" : team, siteId: siteId || null, site: siteName || "", createdAt: Date.now() };
      if (!isWarehouse) {
        if (siteId) {
          var s = findSite(state, siteId);
          if (s) { if (!s.teams) s.teams = []; if (s.teams.indexOf(team) < 0) s.teams.push(team); }
        }
        if (state.teams.indexOf(team) < 0) state.teams.push(team);
      }
      persist(function (ok) {
        authBusy = false;
        if (!ok) { authError = "가입 저장에 실패했어요. 인터넷 연결을 확인해주세요"; renderInputView(); return; }
        setLoggedInWorkerId(id);
        showToast("가입됐어요. 환영해요, " + id + "님");
        renderInputView();
      });
    });
  }

  // ---- admin geofence map (interactive: click / drag the marker to move the site center) ----
  var adminMapInstance = null;
  var adminMapMarker = null;
  var adminMapCircle = null;
  function initAdminGeoMap() {
    var container = document.getElementById("attGeoMap");
    if (!container) return;
    if (!window.L) {
      ensureLeaflet(function () {
        if (window.L) { initAdminGeoMap(); return; }
        var c = document.getElementById("attGeoMap");
        if (c) c.innerHTML = '<div class="att-map-fallback">지도를 불러오지 못했어요 (오프라인이거나 네트워크가 차단됨)<br>아래 위도·경도 값을 직접 입력해주세요.</div>';
      });
      return;
    }
    ensureAttGeoDraft(state);
    var geo = attGeoDraft;

    var map = L.map(container, { attributionControl: false }).setView([geo.lat, geo.lng], 16);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
    var marker = L.marker([geo.lat, geo.lng], { draggable: true }).addTo(map);
    var circle = L.circle([geo.lat, geo.lng], { radius: geo.radius, color: "#E8630A", fillColor: "#E8630A", fillOpacity: 0.12, weight: 2 }).addTo(map);
    adminMapInstance = map; adminMapMarker = marker; adminMapCircle = circle;

    function setCenter(lat, lng) {
      attGeoDraft.lat = lat; attGeoDraft.lng = lng;
      marker.setLatLng([lat, lng]);
      circle.setLatLng([lat, lng]);
      var latEl = document.getElementById("attGeoLat"); if (latEl) latEl.value = lat.toFixed(6);
      var lngEl = document.getElementById("attGeoLng"); if (lngEl) lngEl.value = lng.toFixed(6);
    }

    map.on("click", function (e) { setCenter(e.latlng.lat, e.latlng.lng); });
    marker.on("dragend", function () { var p = marker.getLatLng(); setCenter(p.lat, p.lng); });

    var latInput = document.getElementById("attGeoLat");
    var lngInput = document.getElementById("attGeoLng");
    [latInput, lngInput].forEach(function (el) {
      if (!el) return;
      el.addEventListener("change", function () {
        var lat = parseFloat(latInput.value), lng = parseFloat(lngInput.value);
        if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
          setCenter(lat, lng);
          map.setView([lat, lng]);
        }
      });
    });

    var radiusInput = document.getElementById("attGeoRadius");
    if (radiusInput) {
      radiusInput.addEventListener("input", function () {
        var r = parseFloat(this.value);
        if (!isNaN(r) && r > 0) { attGeoDraft.radius = r; circle.setRadius(r); }
      });
    }

    var locateBtn = document.getElementById("btnAttGeoLocate");
    if (locateBtn) {
      locateBtn.addEventListener("click", function () {
        if (!(window.navigator && navigator.geolocation)) { showToast("이 기기·브라우저는 위치 확인을 지원하지 않아요"); return; }

        navigator.geolocation.getCurrentPosition(function (pos) {

          setCenter(pos.coords.latitude, pos.coords.longitude);

        }, function () {
          locateBtn.disabled = false; locateBtn.textContent = "📍 내 위치로 설정";

      });

  // ---- worker-facing geofence map (read-only: shows the site radius + the worker's own position) ----
  function initWorkerGeoMap() {
    var container = document.getElementById("attGeoWorkerMap");
    if (!container) return;
    if (!window.L) {
      ensureLeaflet(function () {
        if (window.L) { initWorkerGeoMap(); return; }
        var c = document.getElementById("attGeoWorkerMap");
        if (c) c.innerHTML = '<div class="att-map-fallback">지도를 불러오지 못했어요 (오프라인이거나 네트워크가 차단됨)</div>';
      });
      return;
    }
    var geo = getAttGeo(state);
    var map = L.map(container, { attributionControl: false }).setView([geo.lat, geo.lng], 16);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
    L.circle([geo.lat, geo.lng], { radius: geo.radius, color: "#E8630A", fillColor: "#E8630A", fillOpacity: 0.12, weight: 2 }).addTo(map);
    L.marker([geo.lat, geo.lng]).addTo(map).bindPopup("지정 현장");
    if (attLocationState.status === "ok") {
      var within = attLocationState.within;
      var myColor = within ? "#2E7D32" : "#C0392B";
      L.circleMarker([attLocationState.lat, attLocationState.lng], {
        radius: 8, color: myColor, weight: 2, fillColor: myColor, fillOpacity: 0.9
      }).addTo(map).bindPopup("내 위치");
      try {
        var bounds = L.latLngBounds([[geo.lat, geo.lng], [attLocationState.lat, attLocationState.lng]]);
        map.fitBounds(bounds.pad(0.35));
      } catch (e) {}
    }
  }

  function saveAttGeoSettings() {
    var lat = parseFloat(document.getElementById("attGeoLat").value);

    var enabled = document.getElementById("attGeoEnabled").checked;

    state.attendanceGeo = { lat: lat, lng: lng, radius: radius, enabled: enabled };

  function downloadAttendanceExcel(dateStr, teamFilter) {
    var dayRecords = getAttDayRecords(state, dateStr, teamFilter);
    if (!dayRecords.length) { showToast("이 날짜에는 출퇴근 기록이 없어요"); return; }
    ensureXlsx(function (ok) {
      if (!ok) { showToast("엑셀 기능을 불러오지 못했어요. 인터넷 연결을 확인해주세요"); return; }
      var rows = [["작업자아이디", "이름", "소속팀", "출근", "출근확인", "퇴근", "퇴근확인", "근무시간", "상태"]];
      dayRecords.forEach(function (r) {
        var dur = r.clockOutAt ? (r.clockOutAt - r.clockInAt) : null;
        var acct = getAccount(state, r.workerId);
        rows.push([
          r.workerId, (acct && acct.name) || "", r.team, fmtHM(r.clockInAt), attVerifyLabel(r.clockInLoc, r.clockInPhoto),
          r.clockOutAt ? fmtHM(r.clockOutAt) : "-",
          r.clockOutAt ? attVerifyLabel(r.clockOutLoc, r.clockOutPhoto) : "-",
          dur ? fmtDurationMs(dur) : "-",
          r.clockOutAt ? "퇴근완료" : "근무중"
        ]);
      });
      var ws = XLSX.utils.aoa_to_sheet(rows);
      ws["!cols"] = [{ wch: 14 }, { wch: 10 }, { wch: 12 }, { wch: 9 }, { wch: 10 }, { wch: 9 }, { wch: 10 }, { wch: 12 }, { wch: 10 }];
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "출퇴근");
      var wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      var blob = new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      saveBlobAsFile(blob, "출퇴근_" + dateStr + (teamFilter && teamFilter !== "all" ? "_" + teamFilter : "") + ".xlsx").then(function () {
        showToast("엑셀 파일을 다운로드했어요");
      }).catch(function (err) {
        if (err && err.code === "declined") return;
        showToast("다운로드에 실패했어요");
      });
    });
  }
  function downloadAttendancePhotosZip(dateStr, teamFilter) {
    var dayRecords = getAttDayRecords(state, dateStr, teamFilter);
    var items = [];
    dayRecords.forEach(function (r) {
      if (r.clockInPhoto) items.push({ name: (r.workerId || "worker") + "_출근_" + fmtHM(r.clockInAt).replace(":", "") + ".jpg", dataUrl: r.clockInPhoto });
      if (r.clockOutPhoto) items.push({ name: (r.workerId || "worker") + "_퇴근_" + fmtHM(r.clockOutAt).replace(":", "") + ".jpg", dataUrl: r.clockOutPhoto });
    });
    if (!items.length) { showToast("이 날짜에는 저장된 얼굴 사진이 없어요"); return; }
    ensureJszip(function (ok) {
      if (!ok) { showToast("압축 기능을 불러오지 못했어요. 인터넷 연결을 확인해주세요"); return; }
      var zip = new JSZip();
      var folder = zip.folder(dateStr);
      var usedNames = {};
      items.forEach(function (it) {
        var name = it.name;
        if (usedNames[name]) {
          usedNames[name]++;
          name = name.replace(/\.jpg$/, "_" + usedNames[it.name] + ".jpg");
        } else {
          usedNames[name] = 1;
        }
        var base64 = it.dataUrl.split(",")[1] || "";
        folder.file(name, base64, { base64: true });
      });
      zip.generateAsync({ type: "blob" }).then(function (blob) {
        return saveBlobAsFile(blob, dateStr + ".zip");
      }).then(function () {
        showToast("사진을 zip으로 다운로드했어요. 압축을 풀면 '" + dateStr + "' 폴더가 만들어져요");
      }).catch(function (err) {
        if (err && err.code === "declined") return;
        showToast("다운로드에 실패했어요");
      });
    });
  }

  function downloadPhoto(dataUrl, filename) {

    }).catch(function (err) {

  }

        '<div class="field"><label>작성자 직종</label><select id="emRole">' + roleOpts + "</select></div>" +
        '<div class="field"><label>소속팀</label><select id="emTeam">' + teamOpts + "</select></div>" +
        '<div class="field"><label>근무형태</label><select id="emShift">' + shiftOpts + "</select></div>" +
        '<div class="modal-actions">' +
          '<button type="button" class="btn-secondary" id="emCancel">취소</button>' +
          '<button type="button" class="submit-btn" id="emSave" style="margin-top:0">저장</button>' +
        "</div>" +
      "</div>";
    document.body.appendChild(overlay);
    document.getElementById("emCancel").addEventListener("click", closeEditModal);
    overlay.addEventListener("click", function (ev) { if (ev.target === overlay) closeEditModal(); });
    document.getElementById("emSave").addEventListener("click", function () {
      e.workerId = document.getElementById("emWorkerId").value.trim();
      e.role = document.getElementById("emRole").value;
      e.team = document.getElementById("emTeam").value;
      e.shift = document.getElementById("emShift").value;
      closeEditModal();
      persist(function (ok) {
        if (ok) { showToast("수정됐어요"); renderDashView(); }
      });
    });
  }

  function num(id) {
    var v = document.getElementById(id).value;
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }

  function submitEntry() {
    var account = currentAccount();
    if (!account) { showToast("로그인이 필요해요"); renderInputView(); return; }
    var workerId = account.workerId;
    var role = account.role;

    var teamSel = document.getElementById("fTeam").value;
    var team = teamSel;
    if (teamSel === "__new__") {
      var nv = document.getElementById("fTeamNew").value.trim();
      if (!nv) { showToast("새 팀 이름을 입력해주세요"); return; }
      team = nv;
      if (state.teams.indexOf(team) < 0) state.teams.push(team);
    }

    var workAreas = Array.prototype.slice.call(document.querySelectorAll("#workAreaBlocks .work-area-block")).map(function (block) {
      function bv(role) { var el = block.querySelector('[data-role="' + role + '"]'); return el ? el.value : ""; }
      function bn(role) { var v = parseFloat(bv(role)); return isNaN(v) ? 0 : v; }
      return {
        site: bv("site"),
        floor: bv("floor"),
        location: {
          xFrom: bn("xFrom"), xTo: bn("xTo"), yFrom: bn("yFrom"), yTo: bn("yTo"),
          room: (bv("room") || "").trim()
        },
        duct: { anchor: bn("duct-anchor"), channel: bn("duct-channel"), duct: bn("duct-duct"), fitting: bn("duct-fitting") },
        conduit: { channel: bn("conduit-channel"), pipe: bn("conduit-pipe") },
        cable: { cut: bn("cable-cut"), layout: bn("cable-layout"), wire: bn("cable-wire") },
        instrument: { point: bn("inst-point") }
      };
    });

    var entry = {
      id: uid(), team: team, workerId: workerId, role: role,
      date: document.getElementById("fDate").value || todayStr(),
      shift: "day",
      workAreas: workAreas,
      roles: { manager: 0, supervisor: 0, guide: 0 },
      personnel: 0,
      manHours: 0,
      instrumentOther: { ycard: num("qInstYcard"), rework: num("qInstRework"), ycardReason: document.getElementById("qInstYcardReason").value.trim() },
      defect: { qty: num("fDefectQty"), type: document.getElementById("fDefectType").value },
      note: document.getElementById("fNote").value.trim(),
      nextDayPlan: role === LEAD_ROLE ? Array.prototype.slice.call(document.querySelectorAll("#nextPlanBlocks .next-plan-block")).map(function (block) {
        return {
          zone: block.querySelector('[data-role="zone"]').value,
          floor: block.querySelector('[data-role="floor"]').value,
          rows: block.querySelector('[data-role="rows"]').value.trim(),
          room: block.querySelector('[data-role="room"]').value.trim(),
          content: block.querySelector('[data-role="content"]').value.trim()
        };
      }).filter(function (p) { return p.zone || p.floor || p.rows || p.room || p.content; }) : null,
      photos: pendingPhotos.slice(),
      createdAt: Date.now()
    };
    state.entries.unshift(entry);

    var btn = document.getElementById("btnSubmit");
    btn.disabled = true; btn.textContent = "저장 중…";

    persist(function (ok) {
      btn.disabled = false; btn.textContent = "오늘 실적 저장";
      if (ok) {
        pendingPhotos = [];
        showToast("저장됐어요 · 대시보드에 반영됩니다");
        renderInputView(); renderDashView();
      }
    });
  }

  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  function renderFullDocument(st) {
    var cssText = document.getElementById("app-css").textContent;
    var srcText = document.getElementById("app-src").textContent;
    return '<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      "<title>현장 생산성 기록</title>\n" +
      '<style id="app-css">' + cssText + "</style>\n" +
      "</head>\n<body>\n" +
      '<div class="shell">' +
        '<div class="masthead">' +
          '<div class="brand"><span class="mark">현</span><div><h1>현장 생산성 기록</h1>' +
          '<div class="sub">전기·통신 시공 현장 — 투입인원 · 시공물량 관리</div></div></div>' +
          '<div class="sync-note" id="syncNote"><span class="sync-dot" id="syncDot"></span><span id="syncText">동기화 확인 중…</span></div>' +
        "</div>" +
        '<div class="toggle" role="tablist" artifact-local>' +
          '<button type="button" id="tabInput" class="active" role="tab">📱 현장 입력</button>' +
          '<button type="button" id="tabDash" role="tab">🖥 관리자 대시보드</button>' +
        "</div>" +
        '<div id="viewInput" class="view active">' + buildInputViewHtml(st) + "</div>" +
        '<div id="viewDash" class="view">' + buildDashViewHtml(st, currentDashPage, currentDashDateFilter) + "</div>" +
      "</div>" +
      '<div class="toast" id="toast"></div>' +
      '<script id="app-state" type="application/json">' + JSON.stringify(st) + "<" + "/script>\n" +
      '<script id="app-src" type="text/plain">' + srcText + "<" + "/script>\n" +
      '<script>(function(){var s=document.getElementById("app-src").textContent;(0,eval)(s);})();<' + "/script>\n" +
      "</body>\n</html>";
  }

  function persist(cb) {
    if (firebaseDb) {
      firebaseDb.ref("state").set(state).then(function () {
        cb(true);
      }).catch(function () {
        showToast("저장에 실패했어요. 인터넷 연결을 확인해주세요");
        cb(false);
      });
      return;
    }
    if (!artifactApi) { cb(true); return; }
    artifactApi.publish(renderFullDocument(state)).then(function () {
      cb(true);
    }).catch(function (err) {
      if (err && err.code === "conflict") { return; }
      if (err && (err.code === "not_writer" || err.code === "not_granted")) {
        isWriter = false;
        setSyncStatus(false, "읽기 전용 보기");
        showToast("이 보기는 읽기 전용이라 저장할 수 없어요");
      } else if (err && err.code === "too_large") {
        showToast("사진 용량이 너무 커요. 사진 수를 줄이고 다시 시도해주세요");
      } else {
        showToast("저장에 실패했어요. 다시 시도해주세요");
      }
      cb(false);
    });
  }

  function setSyncStatus(on, label) {
    var dot = document.getElementById("syncDot");
    var txt = document.getElementById("syncText");
    if (dot) dot.classList.toggle("off", !on);
    if (txt) txt.textContent = label;
  }

  function initTabs() {
    var tIn = document.getElementById("tabInput");
    var tDa = document.getElementById("tabDash");
    var vIn = document.getElementById("viewInput");
    var vDa = document.getElementById("viewDash");
    tIn.addEventListener("click", function () {
      tIn.classList.add("active"); tDa.classList.remove("active");
      vIn.classList.add("active"); vDa.classList.remove("active");
    });
    tDa.addEventListener("click", function () {
      tDa.classList.add("active"); tIn.classList.remove("active");
      vDa.classList.add("active"); vIn.classList.remove("active");
    });
  }

  function boot() {
    initTabs();
    renderInputView();
    renderDashView();
    initDashDelegation();

    initFirebaseSync(); // shared cross-device storage; falls back gracefully below if it can't load (e.g. blocked network)

    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("artifact").then(function (api) {
        artifactApi = api;
        setSyncStatus(!!api, api ? "홈페이지와 실시간 동기화" : "미리보기 모드 (저장 안 됨)");
      }).catch(function () {
        setSyncStatus(false, "미리보기 모드 (저장 안 됨)");
      });
      window.claude.use("downloads").then(function (api) {
        downloadsApi = api;
      }).catch(function () {});
    } else {
      setSyncStatus(false, "미리보기 모드 (저장 안 됨)");
    }
  }

  boot();
})();
</script>
<script>(function(){var s=document.getElementById("app-src").textContent;(0,eval)(s);})();</script>
