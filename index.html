<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장 생산성 기록</title>
<style id="app-css">
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --bg: #F2F4F6;
    --surface: #FFFFFF;
    --surface-2: #F5F6F8;
    --surface-3: #E8EAED;
    --border: #E1E4E8;
    --text: #191F28;
    --text-muted: #6B7684;
    --text-faint: #9AA3AF;
    --accent: #3182F6;
    --accent-ink: #FFFFFF;
    --accent-soft: #EAF2FE;
    --good: #06A66E;
    --good-soft: #E4F8EF;
    --warn: #D97A0A;
    --warn-soft: #FCF0DE;
    --bad: #F04452;
    --bad-soft: #FDECEE;
    --shadow: 0 1px 2px rgba(25, 31, 40, 0.04), 0 6px 20px rgba(25, 31, 40, 0.06);
    --radius: 10px;
    --radius-soft: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181D;
      --surface: #1E2229;
      --surface-2: #262B33;
      --surface-3: #2E343D;
      --border: #383F4A;
      --text: #F0F2F5;
      --text-muted: #9AA3B2;
      --text-faint: #6B7480;
      --accent: #598EF3;
      --accent-ink: #0B1220;
      --accent-soft: #22314D;
      --good: #26C081;
      --good-soft: #16302A;
      --warn: #E8A23B;
      --warn-soft: #372B16;
      --bad: #F16A76;
      --bad-soft: #3A2126;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #15181D;
    --surface: #1E2229;
    --surface-2: #262B33;
    --surface-3: #2E343D;
    --border: #383F4A;
    --text: #F0F2F5;
    --text-muted: #9AA3B2;
    --text-faint: #6B7480;
    --accent: #598EF3;
    --accent-ink: #0B1220;
    --accent-soft: #22314D;
    --good: #26C081;
    --good-soft: #16302A;
    --warn: #E8A23B;
    --warn-soft: #372B16;
    --bad: #F16A76;
    --bad-soft: #3A2126;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1, h2, h3, .display {
    font-family: "Pretendard", "IBM Plex Sans KR", sans-serif;
    font-weight: 700;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  .num { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  a { color: inherit; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .shell {
    max-width: 1320px;
    margin: 0 auto;
    padding: 22px 20px 64px;
  }
  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .masthead .brand { display: flex; align-items: baseline; gap: 10px; }
  .masthead .brand .mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: "Pretendard", "IBM Plex Sans KR", sans-serif;
    font-weight: 700;
    font-size: 16px;
    flex: none;
  }
  .masthead h1 { font-size: 22px; font-weight: 700; margin: 0; }
  .masthead .sub { color: var(--text-muted); font-size: 13px; }
  .sync-note { font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); flex: none; }
  .sync-dot.off { background: var(--text-faint); box-shadow: 0 0 0 3px var(--surface-2); }

  .toggle {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    margin-bottom: 22px;
  }
  .toggle button {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .toggle button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  .view { display: none; }
  .view.active { display: block; }

  .phone-wrap { display: flex; justify-content: center; }
  .phone {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 26px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .phone-topbar { background: var(--surface-2); padding: 14px 18px 12px; border-bottom: 1px solid var(--border); }
  .phone-topbar .app-name { font-family: "Pretendard", "IBM Plex Sans KR", sans-serif; font-weight: 700; font-size: 16px; }
  .phone-topbar .app-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .phone-body { padding: 16px 18px 22px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600; color: var(--text-muted);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface-2); color: var(--text); font-size: 14.5px; font-family: inherit;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .range-inputs { display: flex; align-items: center; gap: 6px; }
  .range-inputs input { flex: 1; min-width: 0; }
  .range-inputs .range-sep { color: var(--text-faint); font-size: 13px; flex: none; }

  .worker-field { padding: 12px; background: var(--surface-2); border-radius: 10px; margin-bottom: 16px; }
  .worker-field label:first-child { margin-bottom: 6px; }
  .remember-check {
    display: flex; align-items: center; gap: 6px; margin-top: 9px;
    font-size: 12px; color: var(--text-muted); text-transform: none; letter-spacing: 0; font-weight: 500;
  }
  .remember-check input[type="checkbox"] { width: auto; accent-color: var(--accent); }

  .photo-add-btn {
    width: 100%; padding: 10px; border: 1.5px dashed var(--border); border-radius: 8px;
    background: var(--surface-2); color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .photo-add-btn:hover { border-color: var(--accent); color: var(--text); }
  .photo-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .photo-thumb { position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); flex: none; }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-remove {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; border: none;
    background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 10px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }

  .gallery-list { display: flex; flex-direction: column; gap: 18px; }
  .gallery-group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; flex-wrap: wrap; }
  .gallery-meta { font-size: 12px; color: var(--text-muted); }
  .gallery-thumbs { display: flex; flex-wrap: wrap; gap: 10px; }
  .gallery-thumb { width: 112px; flex: none; }
  .gallery-thumb img { width: 112px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); display: block; }
  .gallery-dl {
    margin-top: 5px; width: 100%; padding: 5px 0; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .gallery-dl:hover { color: var(--text); border-color: var(--accent); }

  .storage-panel .storage-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
  .storage-panel .storage-figures { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--text-muted); }
  .storage-panel .storage-figures b { color: var(--text); font-weight: 600; }
  .storage-track { height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
  .storage-fill { height: 100%; border-radius: 6px; transition: width 0.4s ease; }
  .storage-fill.good { background: var(--good); }
  .storage-fill.warn { background: var(--warn); }
  .storage-fill.bad { background: var(--bad); }
  .storage-note { font-size: 11.5px; color: var(--text-faint); margin-top: 7px; }

  .storage-chip {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 8px;
    font-size: 12px; font-weight: 600; margin-bottom: 14px;
  }
  .storage-chip.warn { background: var(--warn-soft); color: var(--warn); }
  .storage-chip.bad { background: var(--bad-soft); color: var(--bad); }

  .section-title {
    font-family: "Pretendard", "IBM Plex Sans KR", sans-serif; font-weight: 600; font-size: 15px;
    margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--surface-3);
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-title .unit-note { font-size: 11px; color: var(--text-faint); font-weight: 500; }

  .dash-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; margin-bottom: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .dash-toolbar .toolbar-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; flex: none; }
  .dash-toolbar .toolbar-group { min-width: 0; }
  .dash-toolbar select {
    padding: 8px 32px 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); font-size: 13.5px; font-family: "IBM Plex Mono", monospace;
    min-width: 0;
  }
  .dash-toolbar select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .dash-toolbar .toolbar-group { display: flex; align-items: center; gap: 8px; }
  .dash-site-filter {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 10px 14px;
    background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px;
  }
  .dash-site-filter label { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; flex: none; }
  .dash-site-filter select {
    padding: 7px 30px 7px 12px; border: 1px solid var(--accent); border-radius: 8px;
    background: var(--surface); color: var(--text); font-size: 13.5px; font-weight: 600; font-family: "IBM Plex Mono", monospace;
    min-width: 0;
  }

  .pg-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
  }
  .pg-size-group, .pg-page-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pg-size-btn, .pg-page-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-family: "IBM Plex Mono", monospace;
    cursor: pointer; line-height: 1.3;
  }
  .pg-page-btn { min-width: 30px; text-align: center; padding: 5px 10px; }
  .pg-size-btn.active, .pg-page-btn.active {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700;
  }
  .pg-size-btn:hover:not(.active), .pg-page-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
  .pg-count { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }
  .pg-ellipsis { color: var(--text-faint); padding: 0 4px; font-size: 12.5px; }

  .po-item-table { border-collapse: collapse; width: 100%; }
  .po-item-table th {
    text-align: left; font-size: 11.5px; font-weight: 700; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.03em; padding: 6px 8px; border-bottom: 1px solid var(--border);
  }
  .po-item-table td { border: 1px solid var(--border); padding: 0; background: var(--surface); }
  .po-item-table td.po-item-remove-cell { border: none; background: transparent; text-align: center; padding: 0 4px; }
  .po-item-table input {
    width: 100%; box-sizing: border-box; border: none; background: transparent; color: var(--text);
    font-family: inherit; font-size: 13.5px; padding: 8px 10px; outline: none;
  }
  .po-item-table input:focus { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
  .po-item-table input[type="number"] { font-family: "IBM Plex Mono", monospace; }

  /* table-layout:fixed + 고정 px 폭: 발주서마다 품목 개수·글자 길이가 달라도 여러 발주서 행에 걸쳐
     품목/규격/수량/단위/비고 세로줄이 항상 같은 위치에 맞도록 고정한다(발주서별로 폭이 제각각이면 표가 안 맞아 보임). */
  .po-items-table { border-collapse: collapse; width: 100%; min-width: 460px; table-layout: fixed; }
  .po-items-table th:nth-child(1), .po-items-table td:nth-child(1) { width: 150px; }
  .po-items-table th:nth-child(2), .po-items-table td:nth-child(2) { width: 120px; }
  .po-items-table th:nth-child(3), .po-items-table td:nth-child(3) { width: 70px; }
  .po-items-table th:nth-child(4), .po-items-table td:nth-child(4) { width: 60px; }
  .po-items-table th:nth-child(5), .po-items-table td:nth-child(5) { width: auto; }
  .po-items-table th {
    text-align: left; font-size: 10.5px; font-weight: 700; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.03em; padding: 3px 8px 4px; border-bottom: 1px solid var(--border);
  }
  .po-items-table td {
    padding: 4px 8px; border-bottom: 1px dashed var(--border); font-size: 13px; vertical-align: middle;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .po-items-table tr:last-child td { border-bottom: none; }
  .po-items-table .po-item-name { font-weight: 600; }
  .po-items-table .po-item-spec { color: var(--text-faint); font-size: 12px; }
  .po-items-table .po-item-qty { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--accent); white-space: nowrap; }
  .po-item-note-input {
    width: 100%; box-sizing: border-box; border: 1px solid transparent; background: var(--surface-2); color: var(--text);
    font-family: inherit; font-size: 12.5px; padding: 5px 7px; border-radius: 6px; outline: none;
  }
  .po-item-note-input:focus { background: var(--surface); border-color: var(--accent); }
  .po-items-empty { color: var(--text-faint); }

  .date-filter-wrap { position: relative; }
  .date-filter-btn {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); font-size: 13.5px; font-family: "IBM Plex Mono", monospace;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .date-filter-btn:hover { border-color: var(--accent); }
  .date-filter-btn .caret { font-size: 10px; color: var(--text-faint); }
  .date-filter-panel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; width: 230px; max-height: 340px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 6px;
  }
  .date-filter-search {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; margin-bottom: 6px;
    background: var(--surface-2); color: var(--text); font-size: 12.5px; font-family: inherit;
  }
  .date-filter-search:focus { outline: none; border-color: var(--accent); }
  .date-filter-all, .date-filter-year, .date-filter-month, .date-filter-date {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: 12.5px; cursor: pointer; border-radius: 6px;
  }
  .date-filter-all { font-weight: 700; border-bottom: 1px solid var(--surface-2); border-radius: 0; margin-bottom: 2px; }
  .date-filter-year { font-weight: 700; }
  .date-filter-month { font-weight: 600; color: var(--text-muted); }
  .date-filter-date { font-family: "IBM Plex Mono", monospace; }
  .date-filter-date:hover, .date-filter-month:hover, .date-filter-year:hover, .date-filter-all:hover { background: var(--surface-2); }
  .date-filter-all input, .date-filter-year input, .date-filter-month input, .date-filter-date input { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; flex: none; }
  .date-filter-node { margin-top: 1px; }
  .date-filter-row { display: flex; align-items: center; }
  .date-filter-row .date-filter-year, .date-filter-row .date-filter-month { flex: 1; padding-left: 2px; }
  .date-filter-toggle {
    border: none; background: none; color: var(--text-faint); cursor: pointer; font-size: 15px;
    width: 28px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center;
  }
  .date-filter-toggle:hover { color: var(--text); background: var(--surface-2); border-radius: 6px; }
  .date-filter-children { padding-left: 20px; }

  .qty-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .qty-item label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
  .qty-item .input-unit { position: relative; }
  .qty-item input {
    width: 100%; padding: 9px 34px 9px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); font-size: 14px; font-family: "IBM Plex Mono", monospace;
  }
  .qty-item .unit { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--text-faint); pointer-events: none; }

  .submit-btn {
    width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 12px;
    background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 700;
    font-family: "Pretendard", "IBM Plex Sans KR", sans-serif; letter-spacing: -0.01em; cursor: pointer;
    transition: background 0.12s ease, transform 0.08s ease;
  }
  .submit-btn:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
  .submit-btn:active { transform: scale(0.985); }
  .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px);
    background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px;
    font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .kpi-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .kpi-tile .label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .kpi-tile .value { font-family: "IBM Plex Mono", monospace; font-size: 25px; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kpi-tile .value .unit { font-size: 13px; color: var(--text-muted); font-weight: 500; margin-left: 3px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
  .panel h2 { font-size: 16.5px; font-weight: 600; margin: 0 0 14px; }
  .panel h2 .count { color: var(--text-muted); font-weight: 500; font-size: 13px; }
  .panel .panel-caption { font-size: 11.5px; color: var(--text-faint); margin: -8px 0 14px; }

  // ---- personal manday calendar ----
  function mandayShiftValue(shifts) {
    return (shifts || []).reduce(function (s, k) { return s + (SHIFT_WEIGHT[k] || 0); }, 0);
  }

  var mandayDraft = null;         // { "YYYY-MM-DD": {shifts:["day","ot"], note:"..."}, ... } — reference to the active month's working copy
  var mandayDraftWorkerId = null; // resets the whole store when the worker id changes
  var mandayDraftStore = {};      // month -> draft object, kept across month navigation so unsaved edits survive
  var mandaySelectedDate = null;

  function ensureMandayDraft(st, workerId, month) {
    if (mandayDraftWorkerId !== workerId) {
      mandayDraftStore = {};
      mandayDraftWorkerId = workerId;
    }
    if (!mandayDraftStore[month]) {
      var d = {};
      (st.mandayLog || []).forEach(function (r) {
        if (r.workerId === workerId && r.date.slice(0, 7) === month) d[r.date] = { shifts: (r.shifts || []).slice(), note: r.note || "" };
      });
      mandayDraftStore[month] = d;
    }
    mandayDraft = mandayDraftStore[month];
  }

  function addMonths(month, delta) {
    var y = parseInt(month.slice(0, 4), 10), mo = parseInt(month.slice(5, 7), 10);
    var d = new Date(y, mo - 1 + delta, 1);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }

  function buildMandayCalendarHtml(st) {
    var account = currentAccount();
    var workerId = account ? account.workerId : "";
    var site = account && account.siteId ? findSite(st, account.siteId) : null;
    var siteTeams = (site && site.teams && site.teams.length) ? site.teams : st.teams; // 소속 현장이 없으면(예: 예전 계정) 전체 팀으로 대체

    var teamOpts = siteTeams.map(function (t) {
      return '<option value="' + escapeHtml(t) + '"' + (t === team ? " selected" : "") + '>' + escapeHtml(t) + "</option>";
    }).join("");
    var month = currentMandayMonth || todayStr().slice(0, 7);
    ensureMandayDraft(st, workerId, month);
    var today = todayStr();
    if (!mandaySelectedDate || mandaySelectedDate.slice(0, 7) !== month) {
      mandaySelectedDate = month === today.slice(0, 7) ? today : (month + "-01");
    }

    var y = parseInt(month.slice(0, 4), 10), mo = parseInt(month.slice(5, 7), 10);
    var days = daysInMonth(y, mo);
    var firstDow = new Date(y, mo - 1, 1).getDay();
    var prevMonthDays = daysInMonth(mo === 1 ? y - 1 : y, mo === 1 ? 12 : mo - 1);

    var total = 0;
    var workDayCount = 0;
    Object.keys(mandayDraft).forEach(function (k) {
      var v = mandayShiftValue(mandayDraft[k].shifts);
      if (v > 0) { total += v; workDayCount += 1; }
    });

    var weekdayHeader = WEEKDAY_LABELS.map(function (w, i) {
      return '<div class="cal-wd-label' + (i === 0 ? " wd-sun" : i === 6 ? " wd-sat" : "") + '">' + w + "</div>";
    }).join("");

    var leadCells = "";
    for (var lc = 0; lc < firstDow; lc++) {
      var pd = prevMonthDays - firstDow + lc + 1;
      leadCells += '<div class="cal-cell cal-outside"><span class="cal-daynum">' + pd + "</span></div>";
    }

    var dayCells = "";
    for (var d = 1; d <= days; d++) {
      var dateStr = month + "-" + String(d).padStart(2, "0");
      var dayEntry = mandayDraft[dateStr] || { shifts: [], note: "" };
      var val = mandayShiftValue(dayEntry.shifts);
      var hasNote = !!(dayEntry.note && dayEntry.note.trim());
      var isToday = dateStr === today;
      var isSelected = dateStr === mandaySelectedDate;
      var cls = "cal-cell" + (isToday ? " cal-today" : "") + (isSelected ? " cal-selected" : "") + (val ? " cal-has-value" : "");
      dayCells += '<button type="button" class="' + cls + '" data-date="' + dateStr + '">' +
        '<span class="cal-daynum">' + d + "</span>" +
        (val ? '<span class="cal-badge">' + fmt1(val) + "</span>" : "") +
        (hasNote ? '<span class="cal-note-dot" title="메모 있음"></span>' : "") +
      "</button>";
    }

    var totalCells = firstDow + days;
    var trailCells = "";
    var trailCount = (7 - (totalCells % 7)) % 7;
    for (var tc = 1; tc <= trailCount; tc++) {
      trailCells += '<div class="cal-cell cal-outside"><span class="cal-daynum">' + tc + "</span></div>";
    }

    var selEntry = mandayDraft[mandaySelectedDate] || { shifts: [], note: "" };
    var selShifts = selEntry.shifts;
    var selVal = mandayShiftValue(selShifts);
    var selD = new Date(mandaySelectedDate + "T00:00:00");
    var selLabel = (selD.getMonth() + 1) + "월 " + selD.getDate() + "일 (" + WEEKDAY_LABELS[selD.getDay()] + ")";
    var editorChips = SHIFT_ORDER.map(function (k) {
      var active = selShifts.indexOf(k) >= 0;
      return '<button type="button" class="shift-chip' + (active ? " active" : "") + '" data-shift="' + k + '">' + SHIFT_LABELS[k] + "</button>";
    }).join("");

    return "" +

    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  function fmtDurationMs(ms) {
    if (!ms || ms < 0) ms = 0;
    var totalMin = Math.round(ms / 60000);
    var h = Math.floor(totalMin / 60), m = totalMin % 60;
    return h + "시간 " + m + "분";
  }
  function attendanceSortDesc(a, b) {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (b.clockInAt || 0) - (a.clockInAt || 0);
  }
  function buildAttGeoStatusHtml(geo) {
    if (!geo.enabled) return '<div class="att-geo-status att-geo-off">📍 위치 확인 없이 사용 중이에요 (관리자 설정)</div>';
    var s = attLocationState;
    if (s.status === "idle" || s.status === "checking") {
      return '<div class="att-geo-status att-geo-checking">📍 현재 위치 확인 중…</div>';
    }
    if (s.status === "unsupported") {
      return '<div class="att-geo-status att-geo-bad">이 기기·브라우저는 위치 확인을 지원하지 않아요. 관리자에게 문의해주세요.</div>';
    }
    if (s.status === "error") {
      return '<div class="att-geo-status att-geo-bad">위치 정보를 가져오지 못했어요 (' + escapeHtml(s.message || "권한을 확인해주세요") + ')' +
        '<button type="button" class="att-geo-retry" id="btnAttGeoRetry">다시 확인</button></div>';
    }
    if (s.within) {
      return '<div class="att-geo-status att-geo-ok">✅ 지정 현장 반경 안에 있어요 (약 ' + Math.round(s.distance) + "m)</div>";
    }
    return '<div class="att-geo-status att-geo-bad">🚫 지정 현장에서 약 ' + Math.round(s.distance) + "m 떨어져 있어요 · 반경 " + geo.radius + "m 안에서만 출퇴근할 수 있어요" +
      '<button type="button" class="att-geo-retry" id="btnAttGeoRetry">다시 확인</button></div>';
  }

  function buildAttendanceViewHtml(st) {
    var account = currentAccount();

    var siteTeams = (site && site.teams && site.teams.length) ? site.teams : st.teams; // 소속 현장이 없으면(예: 예전 계정) 전체 팀으로 대체
    var team = (account && account.team) || siteTeams[0] || "";

    }).join("");
    var log = (st.attendance || []).filter(function (r) { return r.workerId === workerId; });
    var today = todayStr();
    var openRecord = log.filter(function (r) { return !r.clockOutAt; }).sort(attendanceSortDesc)[0];
    var todayRecords = log.filter(function (r) { return r.date === today; }).sort(attendanceSortDesc);

    var geo = getAttGeo(st);

        '<button type="button" class="att-reset-btn" id="btnResetAtt" data-record-id="' + last.id + '">방금 기록 취소</button>';
    } else {

  function wireContractSign() {
    var scopeEl = document.getElementById("viewInput");
    if (!scopeEl) return;
    wireWageDetailToggle(scopeEl);
    Array.prototype.forEach.call(scopeEl.querySelectorAll("[data-contract-self-view]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-contract-self-view");
        var row = (state.laborContracts || []).filter(function (r) { return r.id === id; })[0];
        if (row) openContractViewModal(row);
      });
    });
    var bankYesBtn = document.getElementById("btnBankConfirmYes");
    var bankNoBtn = document.getElementById("btnBankConfirmNo");
    var bankCorrectionSection = document.getElementById("bankCorrectionSection");
    if (bankYesBtn) bankYesBtn.addEventListener("click", function () {
      var id = bankYesBtn.getAttribute("data-contract-id");
      var row = (state.laborContracts || []).filter(function (r) { return r.id === id; })[0];
      if (!row) return;
      row.bankConfirmStatus = "confirmed";
      persist(function (ok) { if (ok) renderInputView(); });
    });
    if (bankNoBtn) bankNoBtn.addEventListener("click", function () {
      if (bankCorrectionSection) bankCorrectionSection.hidden = false;
    });
    var bankCorrectionSubmit = document.getElementById("btnBankCorrectionSubmit");
    if (bankCorrectionSubmit) bankCorrectionSubmit.addEventListener("click", function () {
      var id = bankCorrectionSubmit.getAttribute("data-contract-id");
      var row = (state.laborContracts || []).filter(function (r) { return r.id === id; })[0];
      if (!row) return;
      var bankName = (document.getElementById("bankCorrectionBankName") || {}).value || "";
      var accountNumber = (document.getElementById("bankCorrectionAccountNumber") || {}).value || "";
      bankName = bankName.trim(); accountNumber = accountNumber.trim();
      if (!bankName || !accountNumber) { showToast("은행명과 계좌번호를 입력해주세요"); return; }
      row.bankConfirmStatus = "pending_correction";
      row.bankCorrectionRequest = { bankName: bankName, accountNumber: accountNumber, requestedAt: Date.now() };
      persist(function (ok) { if (ok) { showToast("정정 요청을 보냈어요. 관리자 확인 후 다시 안내드릴게요"); renderInputView(); } });
    });
    var confirmChk = document.getElementById("contractConfirmRead");
    var sigSection = document.getElementById("contractSigSection");
    var signBtn = document.getElementById("btnContractSign");
    if (!confirmChk || !signBtn) return;
    // 서명패드는 "hidden"으로 감춰진 상태에서 초기화하면 캔버스 크기가 0x0으로 잡혀서 이후 글씨가 안 보이거나
    // 엉뚱한 위치에 그려지는 문제가 있다. 그래서 체크박스를 눌러 실제로 화면에 보이게 된 "그 순간"에 딱 한 번만 초기화한다.
    var sigPad = null;
    function refreshSignEnabled() {
      signBtn.disabled = !confirmChk.checked || !sigPad || sigPad.isEmpty();
    }
    confirmChk.addEventListener("change", function () {
      if (sigSection) sigSection.hidden = !confirmChk.checked;
      if (confirmChk.checked && !sigPad) sigPad = wireSignaturePad("contractSigCanvas");
      refreshSignEnabled();
    });
    if (sigSection) {
      sigSection.addEventListener("mouseup", refreshSignEnabled);
      sigSection.addEventListener("touchend", refreshSignEnabled);
    }
    var clearBtn = document.getElementById("contractSigClear");
    if (clearBtn) clearBtn.addEventListener("click", function () { if (sigPad) sigPad.clear(); refreshSignEnabled(); });
    signBtn.addEventListener("click", function () {
      if (!sigPad || sigPad.isEmpty()) { showToast("서명을 해주세요"); return; }
      var id = signBtn.getAttribute("data-contract-id");
      var row = (state.laborContracts || []).filter(function (r) { return r.id === id; })[0];
      if (!row) return;
      row.status = "서명완료";
      row.signatureDataUrl = sigPad.toDataURL();
      row.signedAt = Date.now();
      persist(function (ok) { if (ok) { showToast("서명이 완료됐어요"); renderInputView(); } });
    });
  }

  function composeConsentCanvas(canvas, baseCanvas, data) {
    var ctx = canvas.getContext("2d");
    if (!ctx) return;
    var scale = canvas.width / CONSENT_PDF_W;
    ctx.drawImage(baseCanvas, 0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#1447e6";

    function box(f) { return { x0: f.x0 * scale, top: f.top * scale, x1: f.x1 * scale, bottom: f.bottom * scale }; }
    function stamp(text, f, opts) {
      if (!text) return;
      opts = opts || {};
      var b = box(f);
      var fontSize = Math.max(7, (b.bottom - b.top) * (opts.sizeRatio || 0.62));
      ctx.font = (opts.bold ? "bold " : "") + fontSize + 'px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
      ctx.textAlign = opts.align || "left";
      var x = opts.align === "center" ? (b.x0 + b.x1) / 2 : b.x0 + 3;
      var y = b.bottom - fontSize * 0.26;
      ctx.fillText(text, x, y);
    }
    function checkIn(f) {
      var b = box(f);
      var fontSize = (b.bottom - b.top) * 0.95;
      ctx.font = "bold " + fontSize + "px sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "#1447e6";
      ctx.fillText("✓", (b.x0 + b.x1) / 2, b.bottom - fontSize * 0.12);
    }
    function highlightRow(f) {
      var b = box(f);
      ctx.save();
      ctx.fillStyle = "rgba(20,71,230,0.14)";
      ctx.fillRect(b.x0, b.top, b.x1 - b.x0, b.bottom - b.top);
      ctx.restore();
    }

    stamp(data.name, CONSENT_FIELDS.name, { align: "center" });

    var bd = (data.birthdate || "").replace(/[^0-9]/g, "");
    if (bd.length >= 2) stamp(bd.slice(0, 2), CONSENT_FIELDS.birth_y, { align: "center" });
    if (bd.length >= 4) stamp(bd.slice(2, 4), CONSENT_FIELDS.birth_m, { align: "center" });
    if (bd.length >= 6) stamp(bd.slice(4, 6), CONSENT_FIELDS.birth_d, { align: "center" });

    if (data.gender === "남") checkIn(CONSENT_FIELDS.gender_m);
    else if (data.gender === "여") checkIn(CONSENT_FIELDS.gender_f);

    var idType = data.idType || "resident";
    if (CONSENT_FIELDS.idtype_label[idType]) highlightRow(CONSENT_FIELDS.idtype_label[idType]);
    if (CONSENT_FIELDS.idtype_value[idType]) stamp(data.idNumber || "", CONSENT_FIELDS.idtype_value[idType], {});

    var agreedDate = new Date(data.agreedAt || Date.now());
    stamp(String(agreedDate.getFullYear()).slice(2), CONSENT_FIELDS.date_y, { align: "center" });
    stamp(String(agreedDate.getMonth() + 1), CONSENT_FIELDS.date_m, { align: "center" });
    stamp(String(agreedDate.getDate()), CONSENT_FIELDS.date_d, { align: "center" });

    if (data.signatureDataUrl) {
      var img = new Image();
      img.onload = function () {
        var b = box(CONSENT_FIELDS.sig);
        var ratio = Math.min((b.x1 - b.x0) / img.width, (b.bottom - b.top) / img.height);
        var dw = img.width * ratio, dh = img.height * ratio;
        ctx.drawImage(img, b.x0, b.bottom - dh, dw, dh);
      };
      img.src = data.signatureDataUrl;
    }
  }

  function wireConsentSignedDoc(account) {
    var data = (state.privacyConsents || {})[account.workerId];
    var loadingEl = document.getElementById("consentPdfLoading");
    var failNote = document.getElementById("consentPdfFailNote");
    var downloadBtn = document.getElementById("btnConsentDownload");
    var continueBtn = document.getElementById("btnConsentContinue");
    if (continueBtn) continueBtn.addEventListener("click", function () {
      consentShowSignedDoc = false;
      renderInputView();
    });
    if (!data) return;
    ensurePdfJs(function (ok) {
      if (!ok || !window.pdfjsLib) {
        if (loadingEl) loadingEl.hidden = true;
        if (failNote) failNote.hidden = false;
        return;
      }
      window.pdfjsLib.getDocument(CONSENT_PDF_URL).promise.then(function (pdf) {
        return pdf.getPage(1);
      }).then(function (page) {
        var canvas = document.getElementById("consentPdfCanvas");
        if (!canvas) return;
        var viewport = page.getViewport({ scale: 2 });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        var base = document.createElement("canvas");
        base.width = viewport.width;
        base.height = viewport.height;
        var baseCtx = base.getContext("2d");
        return page.render({ canvasContext: baseCtx, viewport: viewport }).promise.then(function () {
          if (loadingEl) loadingEl.hidden = true;
          composeConsentCanvas(canvas, base, { name: account.name || account.workerId, gender: data.gender, birthdate: data.birthdate, idType: data.idType, idNumber: data.idNumber, signatureDataUrl: data.signatureDataUrl, agreedAt: data.agreedAt });
          if (downloadBtn) {
            downloadBtn.disabled = false;
            downloadBtn.addEventListener("click", function () {
              // 캔버스를 그대로 이미지로 다운로드한다. 서명이 캔버스에 그려지기까지 약간의 시간차가 있을 수 있어 지연 후 캡처한다.
              setTimeout(function () {
                var a = document.createElement("a");
                a.href = canvas.toDataURL("image/png");
                a.download = "개인정보동의서_" + (account.name || account.workerId) + ".png";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
              }, 60);
            });
          }
        });
      }).catch(function () {
        if (loadingEl) loadingEl.hidden = true;
        if (failNote) failNote.hidden = false;
      });
    });
  }

  function wirePrivacyConsentGate() {
    var residentWrap = document.getElementById("consentIdResidentWrap");
    var genericWrap = document.getElementById("consentIdGenericWrap");
    var residentPrefixEl = document.getElementById("consentIdResidentPrefix");
    var birthdateEl = document.getElementById("consentBirthdate");
    function refreshResidentPrefix() {
      var bd = ((birthdateEl && birthdateEl.value) || "").replace(/[^0-9]/g, "");
      if (residentPrefixEl) residentPrefixEl.textContent = bd.length === 6 ? bd : "생년월일 입력";
    }
    if (birthdateEl) birthdateEl.addEventListener("input", refreshResidentPrefix);
    refreshResidentPrefix();

    var idNumberLabel = document.getElementById("consentIdNumberLabel");
    Array.prototype.forEach.call(document.querySelectorAll('input[name="consentIdType"]'), function (radio) {
      radio.addEventListener("change", function () {
        var isResident = radio.checked && radio.value === "resident";
        if (radio.checked) {
          if (residentWrap) residentWrap.hidden = !isResident;
          if (genericWrap) genericWrap.hidden = isResident;
          var t = PRIVACY_ID_TYPES.filter(function (x) { return x.key === radio.value; })[0];
          if (idNumberLabel && t) idNumberLabel.textContent = t.label;
        }
      });
    });

    var confirmChk = document.getElementById("consentConfirmRead");
    var sigSection = document.getElementById("consentSigSection");
    var signBtn = document.getElementById("btnConsentSign");
    if (!confirmChk || !signBtn) return;
    // 서명패드는 hidden 상태(0x0 크기)에서 초기화하면 안 되므로, 체크박스로 실제 화면에 보이게 된 순간에만 한 번 초기화한다.
    var sigPad = null;
    function refreshSignEnabled() {
      signBtn.disabled = !confirmChk.checked || !sigPad || sigPad.isEmpty();
    }
    confirmChk.addEventListener("change", function () {
      if (sigSection) sigSection.hidden = !confirmChk.checked;
      if (confirmChk.checked && !sigPad) sigPad = wireSignaturePad("consentSigCanvas");
      refreshSignEnabled();
    });
    if (sigSection) {
      sigSection.addEventListener("mouseup", refreshSignEnabled);
      sigSection.addEventListener("touchend", refreshSignEnabled);
    }
    var clearBtn = document.getElementById("consentSigClear");
    if (clearBtn) clearBtn.addEventListener("click", function () { if (sigPad) sigPad.clear(); refreshSignEnabled(); });
    signBtn.addEventListener("click", function () {
      if (!sigPad || sigPad.isEmpty()) { showToast("서명을 해주세요"); return; }
      var account = currentAccount();
      if (!account) return;
      var idTypeEl = document.querySelector('input[name="consentIdType"]:checked');
      var genderEl = document.querySelector('input[name="consentGender"]:checked');
      var idType = idTypeEl ? idTypeEl.value : "resident";
      var bd = ((document.getElementById("consentBirthdate") || {}).value || "").replace(/[^0-9]/g, "");
      var idNumber;
      if (idType === "resident") {
        var digit = ((document.getElementById("consentIdResidentDigit") || {}).value || "").replace(/[^0-9]/g, "").slice(0, 1);
        idNumber = bd + (digit ? "-" + digit : "");
      } else {
        idNumber = (document.getElementById("consentIdNumber") || {}).value || "";
      }
      if (!state.privacyConsents) state.privacyConsents = {};
      state.privacyConsents[account.workerId] = {
        gender: genderEl ? genderEl.value : "",
        birthdate: bd,
        idType: idType,
        idNumber: idNumber,
        signatureDataUrl: sigPad.toDataURL(),
        agreedAt: Date.now()
      };
      persist(function (ok) {
        if (ok) {
          showToast("동의서 작성이 완료됐어요");
          consentShowSignedDoc = true;
          renderInputView();
        }
      });
    });
  }

  function buildDashViewHtml(st, page, dateFilter) {
    page = page || "overview";
    if (!isAdminUnlocked) return buildAdminLockHtml();
    var siteToolbarHtml = buildSiteFilterToolbarHtml(st, page);

    // Scope the underlying data to one 현장 for the duration of this render. Mutates the shared `st`
    // (== the module-level `state`) so that aggregate()/monthlyAggregate()/etc — which read
    // state.mandayLog directly rather than through a parameter — see the scoped data too, then
    // restores it before returning so every other code path keeps seeing the full dataset.
    var restore = null;

      var scopeSite = findSite(st, currentDashSiteFilter);

      restore = { entries: st.entries, mandayLog: st.mandayLog, teams: st.teams, attendance: st.attendance };
      st.entries = (st.entries || []).filter(function (e) { return scopeTeams.indexOf(e.team) >= 0; });
      st.mandayLog = (st.mandayLog || []).filter(function (r) { return scopeTeams.indexOf(r.team) >= 0; });
      st.attendance = (st.attendance || []).filter(function (r) { return scopeTeams.indexOf(r.team) >= 0; });
      st.teams = scopeTeams;

    var content;

    else if (page === "settings") content = buildSettingsPageHtml(st);
    else if (page === "storage") content = buildStoragePanelHtml(st);
    else content = buildOverviewPageHtml(st);

    if (restore) {
      st.entries = restore.entries;
      st.mandayLog = restore.mandayLog;
      st.attendance = restore.attendance;

        '<div class="panel"><h2>팀별 요약' + (currentOverviewMonth ? ' <span class="count">· ' + currentOverviewMonth + "</span>" : "") + '</h2><div class="team-cards">' + teamCardsHtml + "</div></div>" +
      "</div>" +
      '<div class="panel">' +
        '<h2>최근 실적 <span class="count">· 최근 8건 · 전체는 실적 로그에서</span></h2>' +
        '<div class="table-scroll"><table>' +
          "<thead><tr><th>일자</th><th>팀</th><th>이름</th><th>아이디</th><th>위치</th><th style=\"text-align:right\">인원</th></tr></thead>" +
          "<tbody>" + recentHtml + "</tbody>" +

  // ---- log page ----
  function dateFilterMatches(dateFilter, date) {
    if (dateFilter === "all") return true;
    return Array.isArray(dateFilter) && dateFilter.indexOf(date) >= 0;
  }
  function dateFilterSummary(allDates, dateFilter) {
    if (dateFilter === "all") return "전체 날짜";
    var n = Array.isArray(dateFilter) ? dateFilter.length : 0;
    if (n === 0) return "날짜 선택 안함";
    if (n === allDates.length) return "전체 날짜";
    if (n === 1) return dateFilter[0];
    return n + "개 날짜 선택됨";
  }
  function buildDateFilterHtml(allDates, dateFilter) {
    var selectedSet = {};
    if (dateFilter === "all") { allDates.forEach(function (d) { selectedSet[d] = true; }); }
    else { (dateFilter || []).forEach(function (d) { selectedSet[d] = true; }); }
    var allChecked = allDates.length > 0 && allDates.every(function (d) { return selectedSet[d]; });
    var summary = dateFilterSummary(allDates, dateFilter);

    // build year -> month -> [dates] tree, ascending
    var tree = {}, years = [];
    allDates.slice().sort().forEach(function (d) {
      var y = d.slice(0, 4), m = d.slice(0, 7);
      if (!tree[y]) { tree[y] = {}; years.push(y); }
      if (!tree[y][m]) tree[y][m] = [];
      tree[y][m].push(d);
    });
    years.sort();

    var searchQ = (dateFilterSearchText || "").trim();
    function matchesSearch(d) { return !searchQ || d.indexOf(searchQ) >= 0; }

    var panelHtml = "";
    if (logDateFilterOpen) {
      var yearBlocks = years.map(function (y) {
        var months = Object.keys(tree[y]).sort();
        var visibleMonths = months.filter(function (m) { return tree[y][m].some(matchesSearch); });
        if (searchQ && !visibleMonths.length) return "";

        var yearAllDates = months.reduce(function (acc, m) { return acc.concat(tree[y][m]); }, []);
        var yearChecked = yearAllDates.every(function (d) { return selectedSet[d]; });
        var yearCollapsed = !!dateFilterCollapsedYears[y];

        var monthBlocks = visibleMonths.map(function (m) {
          var monthAllDates = tree[y][m];
          var visibleDates = monthAllDates.filter(matchesSearch);
          if (searchQ && !visibleDates.length) return "";
          var monthChecked = monthAllDates.every(function (d) { return selectedSet[d]; });
          var monthCollapsed = !!dateFilterCollapsedMonths[m];
          var monthLabel = parseInt(m.slice(5, 7), 10) + "월";

          var dayItems = monthCollapsed ? "" : visibleDates.map(function (d) {
            var checked = !!selectedSet[d];
            var dayLabel = parseInt(d.slice(8, 10), 10) + "일";
            return '<label class="date-filter-date"><input type="checkbox" data-date-item="' + d + '"' + (checked ? " checked" : "") + ">" + dayLabel + "</label>";
          }).join("");

          return '<div class="date-filter-node">' +
            '<div class="date-filter-row">' +
              '<button type="button" class="date-filter-toggle" data-toggle-month="' + m + '">' + (monthCollapsed ? "▸" : "▾") + "</button>" +
              '<label class="date-filter-month"><input type="checkbox" data-date-month="' + m + '"' + (monthChecked ? " checked" : "") + ">" + monthLabel + "</label>" +
            "</div>" +
            (monthCollapsed ? "" : '<div class="date-filter-children">' + dayItems + "</div>") +
          "</div>";
        }).join("");

        return '<div class="date-filter-node">' +
          '<div class="date-filter-row">' +
            '<button type="button" class="date-filter-toggle" data-toggle-year="' + y + '">' + (yearCollapsed ? "▸" : "▾") + "</button>" +
            '<label class="date-filter-year"><input type="checkbox" data-date-year="' + y + '"' + (yearChecked ? " checked" : "") + ">" + y + "년</label>" +
          "</div>" +
          (yearCollapsed ? "" : '<div class="date-filter-children">' + monthBlocks + "</div>") +
        "</div>";
      }).join("");

      panelHtml = '<div class="date-filter-panel" id="dateFilterPanel">' +
        '<input type="text" class="date-filter-search" id="dateFilterSearchInput" placeholder="날짜 검색 (예: 2026-08)" value="' + escapeHtml(dateFilterSearchText || "") + '">' +
        '<label class="date-filter-all"><input type="checkbox" id="dateFilterAll"' + (allChecked ? " checked" : "") + ">(모두 선택)</label>" +
        yearBlocks +
      "</div>";
    }

    return '<div class="date-filter-wrap"><button type="button" class="date-filter-btn" id="dateFilterBtn">' + escapeHtml(summary) + ' <span class="caret">▾</span></button>' + panelHtml + "</div>";
  }

  // ---- 공통 페이지네이션 ----
  // prefix로 어느 목록의 페이징인지 구분한다 (예: "log", "contracts"). 클릭 전용 위임 패턴(initDashDelegation)에 맞춰
  // <select>가 아니라 알약(pill) 버튼으로 페이지 크기를 고른다.
  var PG_SIZE_OPTIONS = [10, 20, 50];
  function buildPaginationHtml(totalCount, pageSize, currentPage, prefix) {
    var totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;
    var startIdx = totalCount === 0 ? 0 : (currentPage - 1) * pageSize + 1;
    var endIdx = Math.min(totalCount, currentPage * pageSize);

    var sizeBtns = PG_SIZE_OPTIONS.map(function (n) {
      return '<button type="button" class="pg-size-btn' + (n === pageSize ? " active" : "") + '" data-pg-size="' + prefix + ":" + n + '">' + n + "개씩</button>";
    }).join("");

    var pageBtns = "";
    if (totalPages <= 7) {
      for (var p = 1; p <= totalPages; p++) pageBtns += pgBtn(p);
    } else {
      pageBtns += pgBtn(1);
      var lo = Math.max(2, currentPage - 1);
      var hi = Math.min(totalPages - 1, currentPage + 1);
      if (lo > 2) pageBtns += '<span class="pg-ellipsis">…</span>';
      for (var p2 = lo; p2 <= hi; p2++) pageBtns += pgBtn(p2);
      if (hi < totalPages - 1) pageBtns += '<span class="pg-ellipsis">…</span>';
      pageBtns += pgBtn(totalPages);
    }
    function pgBtn(n) {
      return '<button type="button" class="pg-page-btn' + (n === currentPage ? " active" : "") + '" data-pg-page="' + prefix + ":" + n + '">' + n + "</button>";
    }

    return '<div class="pg-bar">' +
      '<div class="pg-size-group">' + sizeBtns + "</div>" +
      '<div class="pg-count">' + (totalCount === 0 ? "0건" : fmt(startIdx) + "-" + fmt(endIdx) + " / 전체 " + fmt(totalCount) + "건") + "</div>" +
      '<div class="pg-page-group">' + pageBtns + "</div>" +
    "</div>";
  }

  function buildLogPageHtml(st, dateFilter) {
    var teams = st.teams || [];
    st.entries = st.entries || [];
    var allDates = uniqueDatesDesc(st.entries);
    var teamFilter = currentLogTeamFilter;
    var siteFilter = currentLogSiteFilter;
    if (teamFilter !== "all" && teams.indexOf(teamFilter) < 0) teamFilter = currentLogTeamFilter = "all";
    var allSites = [];
    var seenSite = {};
    st.entries.forEach(function (e) {
      (e.workAreas || []).forEach(function (w) { if (w.site && !seenSite[w.site]) { seenSite[w.site] = true; allSites.push(w.site); } });
    });
    allSites.sort();
    if (siteFilter !== "all" && allSites.indexOf(siteFilter) < 0) siteFilter = currentLogSiteFilter = "all";

    var entries = st.entries
      .filter(function (e) { return dateFilterMatches(dateFilter, e.date); })
      .filter(function (e) { return teamFilter === "all" || e.team === teamFilter; })
      .filter(function (e) { return siteFilter === "all" || entryHasSite(e, siteFilter); });
    var agg = aggregate(teams, entries, function (r) {
      return dateFilterMatches(dateFilter, r.date) && (teamFilter === "all" || r.team === teamFilter);
    });
    var t = agg.total;

    var teamOpts = '<option value="all"' + (teamFilter === "all" ? " selected" : "") + '>전체 팀</option>' +

    var siteOpts = '<option value="all"' + (siteFilter === "all" ? " selected" : "") + '>전체 구역</option>' +
      allSites.map(function (s) { return '<option value="' + escapeHtml(s) + '"' + (s === siteFilter ? " selected" : "") + '>' + escapeHtml(s) + '</option>'; }).join("");
    var toolbarHtml = '<div class="dash-toolbar">' +
      '<div class="toolbar-group"><span class="toolbar-label">조회 날짜</span>' + buildDateFilterHtml(allDates, dateFilter) + "</div>" +
      '<div class="toolbar-group"><span class="toolbar-label">팀</span><select id="fLogTeam">' + teamOpts + "</select></div>" +
      '<div class="toolbar-group"><span class="toolbar-label">구역</span><select id="fLogSite">' + siteOpts + "</select></div>" +
    "</div>";

    var kpiHtml = '<div class="kpi-row">' +
      kpiTile("입력건수", fmt(entries.length), "건") +
      kpiTile("투입인원", fmt(t.personnel), "명") +
      kpiTile("투입공수", fmt1(t.manHours), "공수") +
      kpiTile("불량수량", fmt(t.defectQty), "건") +
    "</div>";

    var logMandayIdx = mandayIndexByTeamDate(st.mandayLog);
    var logPersonnelIdx = personnelIndexByTeamDate(st.mandayLog);
    var logTotalPages = Math.max(1, Math.ceil(entries.length / logPageSize));
    if (logPageCurrent > logTotalPages) logPageCurrent = logTotalPages;
    if (logPageCurrent < 1) logPageCurrent = 1;
    var logPageEntries = entries.slice((logPageCurrent - 1) * logPageSize, logPageCurrent * logPageSize);
    var rowsHtml = entries.length ? logPageEntries.map(function (e) {
      var color = teamColor(teams, e.team);
      var defectTxt = e.defect && e.defect.qty ? fmt(e.defect.qty) + (e.defect.type ? " (" + escapeHtml(e.defect.type) + ")" : "") : "—";
      var instOther = e.instrumentOther || {};
      var ycardTxt = instOther.ycard ?
        '<div class="ycard-note">🟡 Y카드 ' + fmt(instOther.ycard) + "건" + (instOther.ycardReason ? " — " + escapeHtml(instOther.ycardReason) : "") + "</div>" : "";
      var pKey = logPersonnelIdx[e.team + "|" + e.date] || { personnel: 0, roles: { manager: 0, supervisor: 0, guide: 0 } };
      var roleTxt = ROLE_KEYS.map(function (k) { return (pKey.roles[k] || 0) ? ROLE_LABELS[k] + " " + pKey.roles[k] : ""; }).filter(Boolean).join(" · ") || "—";
      var cableLayoutSum = (e.workAreas || []).reduce(function (s, w) { return s + ((w.cable && w.cable.layout) || 0); }, 0);
      return "<tr>" +
        "<td>" + escapeHtml(e.date) + " " + shiftPillHtml(e) + "</td>" +
        '<td><span class="team-pill" style="background:' + hexToSoft(color) + ";color:" + color + '">' + escapeHtml(e.team) + "</span></td>" +
        "<td>" + workerNameCellHtml(e) + "</td>" +
        "<td>" + escapeHtml(e.workerId || "—") + "</td>" +
        "<td>" + escapeHtml(formatWorkAreasText(e)) + "</td>" +
        '<td class="num-cell">' + fmt(pKey.personnel) + '<div class="role-breakdown">' + escapeHtml(roleTxt) + "</div></td>" +
        '<td class="num-cell">' + fmt(logMandayIdx[e.team + "|" + e.date] || 0) + "</td>" +
        '<td class="num-cell">' + fmt(cableLayoutSum) + "</td>" +
        "<td>" + defectTxt + "</td>" +
        "<td>" + escapeHtml(e.note || "") + ycardTxt + formatNextDayPlanHtml(e) + "</td>" +
        '<td><button type="button" class="row-edit-btn" data-edit-entry="' + e.id + '">✎ 수정</button></td>' +
      "</tr>";
    }).join("") : '<tr><td colspan="11"><div class="empty-state">' +
      (st.entries.length === 0 ? '아직 입력된 실적이 없습니다. "현장 입력" 탭에서 첫 실적을 기록해보세요.' : "선택한 조건(" + dateFilterSummary(allDates, dateFilter) + ")에 해당하는 실적이 없습니다.") +
      "</div></td></tr>";

    return toolbarHtml + kpiHtml +
      '<div class="panel">' +
        '<div class="panel-head-row"><h2>실적 로그 <span class="count">· 전체 ' + fmt(entries.length) + '건</span></h2>' +
          '<button type="button" class="csv-dl-btn" data-csv-log="1">⬇ CSV 전체 다운로드</button>' +
        "</div>" +
        '<div class="panel-caption" style="margin-top:-4px">다운로드는 현재 조회 조건에 해당하는 전체 실적이 담겨요.</div>' +
        '<div class="table-scroll"><table>' +
          "<thead><tr><th>일자/근무</th><th>팀</th><th>이름</th><th>아이디</th><th>위치</th><th style=\"text-align:right\">인원</th><th style=\"text-align:right\">공수</th><th style=\"text-align:right\">포설(M)</th><th>불량</th><th>비고</th><th></th></tr></thead>" +
          "<tbody>" + rowsHtml + "</tbody>" +
        "</table></div>" +
        buildPaginationHtml(entries.length, logPageSize, logPageCurrent, "log") +
      "</div>";
  }

  // ---- monthly stats page ----
  function buildMonthlyPageHtml(st) {
    var ma = monthlyAggregate(st.entries);

    if (!months.length) return emptyPanel("월별 통계", "아직 데이터가 없습니다. 실적을 입력하면 월별로 자동 집계돼요.");

    var rows1 = [
      { label: "투입인원", unit: "명", values: mapMonths(months, function (m) { return ma.byMonth[m].personnel; }) },

      { label: "불량수량", unit: "point·EA", values: mapMonths(months, function (m) { return ma.byMonth[m].defectQty; }) },
      { label: "양품수량", unit: "point·EA", values: mapMonths(months, function (m) { return Math.max(0, ma.byMonth[m].countable - ma.byMonth[m].defectQty); }) },

    ];
    var rows2 = [

    });

    return '<div class="panel"><div class="panel-head-row"><h2>월별 생산실적</h2>' + csvBtnHtml("월별_생산실적") + "</div>" +
        '<div class="panel-caption">생산·불량·양품수량은 point·EA 단위 항목(Anchor, Fitting, Instrument, Y카드) 기준입니다.</div>' +

        '<div class="panel-caption">투입공수 = "내 공수 캘린더"에 팀원들이 입력한 값의 합 (근무형태 가중치: 조출0.5·주간1.0·연장0.5·야간1.0·철야2.0)</div>' +
        buildStatTable(months, rows2) +

      "</div>";

  // ---- daily stats page ----
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
  function dailyTeamAggregate(entries, month) {
    // team -> day-of-month(int) -> freshAgg()-shaped bucket
    entries = entries || [];
    var out = {};
    entries.forEach(function (e) {
      if (monthOf(e) !== month) return;
      var dd = dayOfMonthNum(e);
      if (!dd) return;
      if (!out[e.team]) out[e.team] = {};
      if (!out[e.team][dd]) out[e.team][dd] = freshAgg();
      accumulate(out[e.team][dd], e);
    });
    (state.mandayLog || []).forEach(function (r) {
      if ((r.date || "").slice(0, 7) !== month) return;
      var dd = parseInt((r.date || "").slice(8, 10), 10);
      if (!dd) return;
      if (!out[r.team]) out[r.team] = {};
      if (!out[r.team][dd]) out[r.team][dd] = freshAgg();
      applyMandayRecordToBucket(out[r.team][dd], r);
    });
    return out;
  }
  function buildDailyPageHtml(st) {
    var months = uniqueMonthsAsc(st.entries);
    if (!months.length) return emptyPanel("일별 통계", "아직 데이터가 없습니다. 실적을 입력하면 일별 투입인원이 여기 표시돼요.");
    if (!currentDailyMonth || months.indexOf(currentDailyMonth) < 0) currentDailyMonth = months[months.length - 1];

    var monthOpts = months.map(function (m) {
      return '<option value="' + m + '"' + (m === currentDailyMonth ? " selected" : "") + ">" + m + "</option>";
    }).join("");
    var toolbarHtml = '<div class="dash-toolbar">' +
      '<div class="toolbar-group"><span class="toolbar-label">조회 월</span><select id="fDailyMonth">' + monthOpts + "</select></div>" +
    "</div>";

    var y = parseInt(currentDailyMonth.slice(0, 4), 10);
    var mo = parseInt(currentDailyMonth.slice(5, 7), 10);
    var days = daysInMonth(y, mo);
    var byDay = {};
    for (var d = 1; d <= days; d++) byDay[d] = { dawn: 0, day: 0, ot: 0, night: 0, allnight: 0 };
    // 근무형태별 인원은 더 이상 실적 입력이 아니라, 팀원이 "내 공수 캘린더"에 직접 남긴 근무형태를 센다.
    (st.mandayLog || []).forEach(function (r) {
      if ((r.date || "").slice(0, 7) !== currentDailyMonth) return;

      (r.shifts || []).forEach(function (sh) {
        if (byDay[dn][sh] !== undefined) byDay[dn][sh] += 1;

    var dayCols = [];
    for (var i = 1; i <= days; i++) dayCols.push(i);

    var weekdayHeadRow = "<tr><th class=\"rowlabel\">요일</th>" + dayCols.map(function (dd) {
      return "<th>" + WEEKDAY_LABELS[new Date(y, mo - 1, dd).getDay()] + "</th>";
    }).join("") + "<th>합계</th></tr>";

    // ---- panel 1: 그 날의 전체 투입인원 ----
    var totalByDay = {};
    dayCols.forEach(function (dd) {
      totalByDay[dd] = byDay[dd].dawn + byDay[dd].day + byDay[dd].ot + byDay[dd].night + byDay[dd].allnight;
    });
    var totalPersonnel = dayCols.reduce(function (s, dd) { return s + totalByDay[dd]; }, 0);
    var totalCells = dayCols.map(function (dd) {

    }).join("");
    var totalTable = '<div class="stat-table-wrap"><table class="stat-table">' +
      "<thead><tr><th class=\"rowlabel\">일자</th>" + dayCols.map(function (dd) { return "<th>" + dd + "</th>"; }).join("") + "<th>합계</th></tr>" +
      weekdayHeadRow +
      "</thead><tbody>" +
      '<tr><td class="rowlabel">총 투입인원</td>' + totalCells + '<td class="num" style="font-weight:700">' + fmt(totalPersonnel) + "</td></tr>" +
      "</tbody></table></div>";

    // ---- panel 2: 근무형태별 투입인원 ----
    function shiftRow(key, label) {
      var sum = 0;
      var cells = dayCols.map(function (dd) {
        var v = byDay[dd][key];
        sum += v;
        return '<td class="num">' + (v ? fmt(v) : "–") + "</td>";
      }).join("");
      return '<tr><td class="rowlabel">' + label + "</td>" + cells + '<td class="num" style="font-weight:700">' + fmt(sum) + "</td></tr>";
    }
    var shiftTable = '<div class="stat-table-wrap"><table class="stat-table">' +
      "<thead><tr><th class=\"rowlabel\">일자</th>" + dayCols.map(function (dd) { return "<th>" + dd + "</th>"; }).join("") + "<th>합계</th></tr>" +

  // 엑셀에서 복사한 셀(탭 구분) 또는 PDF에서 뽑아낸 표 형태 텍스트(공백 2칸 이상 구분)를 자재 품목 목록으로 해석한다.
  // 헤더 행(품명/규격/수량 등)이 있으면 그 열 순서를 따르고, 없으면 품명·규격·수량·단위 순서로 가정한다.
  function parseItemsFromRawText(text) {
    if (!text) return null;
    var lines = text.replace(/ /g, " ").split(/\r?\n/);
    var headerIdx = -1, colIndex = null;
    for (var i = 0; i < lines.length; i++) {
      var t = lines[i];
      if (/품[명목]/.test(t) && /규격/.test(t) && /수량/.test(t)) {
        var headerTokens = t.trim().split(/\t|\s{2,}/).map(function (s) { return s.trim(); }).filter(Boolean);
        var ci = {};
        headerTokens.forEach(function (tok, idx) {
          if (/품[명목]/.test(tok)) ci.name = idx;
          else if (/규격/.test(tok)) ci.spec = idx;
          else if (/수량/.test(tok)) ci.qty = idx;
          else if (/단위/.test(tok)) ci.unit = idx;
        });
        if (ci.name != null && ci.qty != null) { headerIdx = i; colIndex = ci; break; }
      }
    }
    var startLine = headerIdx >= 0 ? headerIdx + 1 : 0;
    if (!colIndex) colIndex = { name: 0, spec: 1, qty: 2, unit: 3 };
    var items = [];
    for (var j = startLine; j < lines.length; j++) {
      var line = lines[j];
      var trimmed = line.trim();
      if (!trimmed) continue;
      if (/이상\s*발주|NEGO|최종\s*발주\s*금액|^TOTAL|^합\s*계/i.test(trimmed)) break;
      var tokens = trimmed.split(/\t|\s{2,}/).map(function (s) { return s.trim(); }).filter(Boolean);
      if (tokens.length < 2) continue;
      var name = tokens[colIndex.name] || "";
      var spec = colIndex.spec != null ? (tokens[colIndex.spec] || "") : "";
      var qtyRaw = tokens[colIndex.qty] || "";
      var unit = colIndex.unit != null ? (tokens[colIndex.unit] || "") : "";
      var qty = parseFloat(String(qtyRaw).replace(/,/g, "")) || 0;
      // 열 인덱스로 못 찾았으면(줄마다 칸 수가 다를 때) 숫자 토큰을 직접 찾아서 보정한다.
      if (!qty) {
        for (var k = 0; k < tokens.length; k++) {
          if (/^[\d,]+(\.\d+)?$/.test(tokens[k]) && parseFloat(tokens[k].replace(/,/g, "")) > 0) {
            qty = parseFloat(tokens[k].replace(/,/g, ""));
            if (!name) name = tokens.slice(0, k).join(" ");
            if (!unit && tokens[k + 1] && !/^[\d,]+(\.\d+)?$/.test(tokens[k + 1])) unit = tokens[k + 1];
            break;
          }
        }
      }
      if (name && qty > 0) items.push({ name: name, spec: spec, qty: qty, unit: unit });
    }
    return items.length ? items : null;
  }
  // PDF/엑셀 원문에서 업체명·발주일·납기일을 최대한 뽑아본다 (못 찾으면 그냥 비워둔다 — 관리자가 확인 후 채우면 된다).
  function parsePoMetaFromRawText(text) {

  function extractPdfLayoutText(arrayBuffer, done) {
    pdfjsLib.getDocument({ data: arrayBuffer }).promise.then(function (pdf) {
      var pageTexts = [];
      var pageNum = 1;
      function nextPage() {
        if (pageNum > pdf.numPages) { done(pageTexts.join("\n")); return; }
        pdf.getPage(pageNum).then(function (page) {
          return page.getTextContent();
        }).then(function (content) {
          var rows = {};
          content.items.forEach(function (it) {
            if (!it.str || !it.str.trim()) return;
            var y = Math.round(it.transform[5] / 3) * 3; // 좌표 오차 흡수용으로 3px 단위로 반올림
            if (!rows[y]) rows[y] = [];
            rows[y].push({ x: it.transform[4], str: it.str });
          });
          var ys = Object.keys(rows).map(Number).sort(function (a, b) { return b - a; }); // 위에서 아래로
          var lines = ys.map(function (y) {
            var runs = rows[y].sort(function (a, b) { return a.x - b.x; });
            var line = "", lastEnd = null;
            runs.forEach(function (r) {
              if (lastEnd != null) {
                var gap = r.x - lastEnd;
                line += gap > 8 ? "  " : "";
              }
              line += r.str;
              lastEnd = r.x + r.str.length * 5; // 대략적인 글자폭 추정
            });
            return line;
          });
          pageTexts.push(lines.join("\n"));
          pageNum++;
          nextPage();
        }).catch(function () { pageNum++; nextPage(); });
      }
      nextPage();
    }).catch(function () { done(""); });
  }
